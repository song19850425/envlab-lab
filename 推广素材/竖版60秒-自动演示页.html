<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnvLab 竖版 60 秒自动演示页 · 录屏素材</title>
<meta name="description" content="EnvLab 竖版短视频录屏素材：9:16 画布自动播放 60 秒，展示跳过步骤被阻断、参数变更数据作废、异常值物理解释三个判错瞬间。配合分镜脚本使用。">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --ink:#0a0e17;--card:#131a2e;--border:rgba(255,255,255,.08);
  --accent:#38bdf8;--glow:#7dd3fc;--abg:rgba(56,189,248,.12);
  --green:#34d399;--amber:#f59e0b;--rose:#fb7185;
  --muted:#94a3b8;--muted2:#7c8ba1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#05080f;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{
  position:fixed;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;
  background:
    radial-gradient(circle at 18% -6%,rgba(56,189,248,.16),transparent 42%),
    radial-gradient(circle at 104% 62%,rgba(167,139,250,.11),transparent 40%),
    var(--ink);
  display:flex;flex-direction:column;padding:96px 72px 96px;overflow:hidden;
}
.bar{position:absolute;left:0;top:0;width:100%;height:8px;background:rgba(255,255,255,.06)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--glow))}
.top{display:flex;align-items:baseline;gap:16px;flex:0 0 auto}
.wm{font-size:34px;font-weight:800;color:var(--glow);letter-spacing:.02em}
.wm-sub{font-size:23px;font-weight:600;color:var(--muted2)}
#scene{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:44px}
.scene{flex:1;display:flex;flex-direction:column;min-height:0}
.scene.center{justify-content:center}

.kick{font-size:27px;font-weight:700;letter-spacing:.16em;color:var(--accent);margin-bottom:34px}
.kick2{font-size:31px;font-weight:800;letter-spacing:.06em;color:var(--accent);margin-bottom:48px}
.s1 h1{font-size:100px;line-height:1.2;font-weight:900;letter-spacing:-.03em;color:#f2f8fd}
.s1 h1 em{font-style:normal;color:var(--glow)}
.s1 .sub{margin-top:36px;font-size:38px;color:var(--muted)}

.steps{display:grid;gap:18px;margin-bottom:34px}
.st{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:26px 32px;border-radius:16px;border:2px solid var(--border);
  background:rgba(255,255,255,.03);font-size:36px;font-weight:700;color:#8fa3b8;
  transition:background .3s,border-color .3s,color .3s,box-shadow .3s;
}
.st small{font-size:21px;font-weight:700;letter-spacing:.1em;color:var(--muted2);white-space:nowrap}
.st.done{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.10);color:#6ee7b7}
.st.done small{color:#4bb98c}
.st.blocked{border-color:rgba(251,113,133,.72);background:rgba(251,113,133,.14);color:#ffd0d8;animation:shake .45s}
.st.blocked small{color:#e08b98}
.st.void{border-color:rgba(148,163,184,.22);background:rgba(148,163,184,.06);color:#5d6b7d;text-decoration:line-through}
.st.void small{color:#4d5967}
.st.tap{box-shadow:0 0 0 6px rgba(56,189,248,.38),0 0 0 16px rgba(56,189,248,.13)}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-15px)}38%{transform:translateX(13px)}58%{transform:translateX(-9px)}78%{transform:translateX(5px)}}

.out{
  margin-top:auto;padding:32px 34px;border-radius:18px;border:2px solid var(--border);
  background:rgba(255,255,255,.045);font-size:33px;line-height:1.5;color:#dbe8f4;min-height:290px;
}
.out .no{color:#ffc1cb;font-weight:800}
.out .why{display:block;margin-top:16px;font-size:29px;line-height:1.5;color:var(--muted)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.param{
  display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:30px;
  padding:26px 30px;border-radius:16px;border:2px solid rgba(56,189,248,.3);
  background:var(--abg);font-size:34px;color:#cfe6f7;
}
.param b{font-size:46px;font-weight:900;color:#eaf7ff}
.param b.old{color:#6f8199;text-decoration:line-through}
.param b.hl{color:var(--amber)}

.rows{display:grid;gap:20px;margin-bottom:34px}
.row{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:30px 34px;border-radius:16px;border:2px solid var(--border);
  background:rgba(255,255,255,.03);font-size:35px;color:#c3d5e5;
}
.row b{font-size:44px;font-weight:900;color:#eaf4ff;white-space:nowrap}
.row b.warn{color:var(--rose)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:34px}
.cell{padding:34px 26px;border-radius:20px;border:2px solid var(--border);background:rgba(255,255,255,.035);text-align:center}
.cell b{display:block;font-size:84px;font-weight:900;line-height:1;color:var(--glow)}
.cell span{display:block;margin-top:14px;font-size:25px;color:var(--muted)}

.s6{align-items:center;justify-content:center;text-align:center}
.s6 .logo{font-size:132px;font-weight:900;letter-spacing:-.045em;color:#eaf7ff}
.s6 .logo em{font-style:normal;color:var(--glow)}
.s6 .url{margin-top:40px;font-size:40px;font-weight:700;color:var(--accent);word-break:break-all;padding:0 20px}
.s6 .tags{margin-top:30px;font-size:27px;color:var(--muted)}

#gate{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(5,8,15,.95);transition:opacity .35s;
}
#gate.hide{opacity:0;pointer-events:none}
.gbox{
  width:min(620px,88vw);padding:46px 42px;border-radius:22px;
  border:1px solid rgba(255,255,255,.13);background:rgba(19,26,46,.97);text-align:center;
}
.gkick{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--accent)}
.gtitle{margin-top:15px;font-size:23px;font-weight:800;color:#eaf7ff}
.gbtns{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.gbtn{
  padding:14px 26px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
  background:transparent;color:#c3d5e5;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.gbtn:hover{background:rgba(255,255,255,.07)}
.gbtn.pri{border-color:rgba(56,189,248,.5);background:var(--abg);color:#e5f8ff}
.gbtn.pri:hover{background:rgba(56,189,248,.26)}
.ghint{margin-top:24px;font-size:12.5px;line-height:1.85;color:#8fa3b8}
.ghint b{color:#a9c9df}
.ghint code{font-family:ui-monospace,Consolas,monospace;color:#7dd3fc}

#hud{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:16px;padding:12px 22px;border-radius:999px;
  background:rgba(10,14,23,.92);border:1px solid rgba(255,255,255,.13);
  color:#93a8bd;font-size:14px;font-family:ui-monospace,Consolas,monospace;white-space:nowrap;
  opacity:0;transition:opacity .35s;pointer-events:none;z-index:10;
}
#hud.show{opacity:1}
#hud b{color:#7dd3fc;font-weight:700}
#hud .sep{color:#3d4c5e}
</style>
</head>
<body>
<div id="stage">
  <div class="bar"><i id="prog"></i></div>
  <div class="top"><span class="wm">EnvLab</span><span class="wm-sub">环境监测交互实验</span></div>
  <main id="scene"></main>
</div>
<div id="gate">
  <div class="gbox">
    <div class="gkick">ENVLAB · 竖版 60 秒演示</div>
    <div class="gtitle">录屏素材 · 含中文配音</div>
    <div class="gbtns">
      <button class="gbtn pri" id="gStart" type="button">开始播放（含配音）</button>
      <button class="gbtn" id="gMute" type="button">静音播放</button>
    </div>
    <div class="ghint">
      浏览器需要一次点击才能播放语音。<b>建议用 Edge 打开</b>——中文配音音质明显好于 Chrome。<br>
      录制顺序：先点这里 → 再开始录屏（OBS 记得开<b>桌面音频</b>）。<br>
      播放中按 <b>V</b> 开关配音 · <code>?scene=N</code> 单镜重录 · <code>?auto=1</code> 跳过本页
    </div>
  </div>
</div>
<div id="hud">
  <span id="hudScene">镜 1 / 6</span><span class="sep">·</span>
  <span id="hudTime">00:00 / 01:00</span><span class="sep">·</span>
  <span id="hudVoice">配音 <b>开</b></span><span class="sep">·</span>
  <span>空格 暂停</span><span class="sep">·</span>
  <span>← → 切换</span><span class="sep">·</span>
  <span>R 重播</span><span class="sep">·</span>
  <span>V 配音</span><span class="sep">·</span>
  <span>H 隐藏</span>
</div>
<script>
(function(){
  "use strict";
  var TOTAL=60000;
  var stage=document.getElementById("stage");
  var sceneEl=document.getElementById("scene");
  var prog=document.getElementById("prog");
  var hud=document.getElementById("hud");
  var hudScene=document.getElementById("hudScene");
  var hudTime=document.getElementById("hudTime");

  function setOut(el,html){
    if(!el)return;
    el.innerHTML=html;
    el.style.animation="none";
    void el.offsetWidth;
    el.style.animation="fadeUp .42s ease";
  }
  function byId(id){return document.getElementById(id);}

  function r1(){
    sceneEl.innerHTML='<div class="scene center s1">'
      +'<div class="kick">环境监测 · 交互仿真实验</div>'
      +'<h1>照着步骤点一遍，<br><em>就算学会了？</em></h1>'
      +'<div class="sub">这个网站，会拦住你。</div>'
      +'</div>';
  }

  function r2(){
    sceneEl.innerHTML='<div class="scene s23">'
      +'<div class="kick2">① 跳过步骤，会被拦住</div>'
      +'<div class="steps">'
      +'<div class="st done">工况稳定确认<small>STEP 1</small></div>'
      +'<div class="st">测进口风速<small>STEP 2</small></div>'
      +'<div class="st" id="st3">测阻力<small>STEP 3</small></div>'
      +'<div class="st">测总效率<small>STEP 4</small></div>'
      +'<div class="st">测分级效率<small>STEP 5</small></div>'
      +'</div>'
      +'<div class="out" id="outA">点任意一步开始。</div>'
      +'</div>';
  }
  function s2Tap(){
    var el=byId("st3");
    if(el)el.classList.add("tap");
    setOut(byId("outA"),'正在执行 <b>STEP 3 · 测阻力</b>…');
  }
  function s2Block(){
    var el=byId("st3");
    if(el){el.classList.remove("tap");el.classList.add("blocked");}
    setOut(byId("outA"),'<span class="no">⛔ 已阻断：不能跳过 STEP 2</span><br>'
      +'你想做的是 <b>STEP 3 · 测阻力</b>，但 <b>STEP 2 · 测进口风速</b> 还没做。'
      +'<span class="why">为什么不能跳：风速是后面所有计算的输入。没有风速就算不出分割粒径 d₅₀，效率数据也无法归一化比较——测了也白测。</span>');
  }

  function r3(){
    sceneEl.innerHTML='<div class="scene s23">'
      +'<div class="kick2">② 改了参数，已测数据自动作废</div>'
      +'<div class="steps">'
      +'<div class="st done">工况稳定确认<small>STEP 1</small></div>'
      +'<div class="st done" id="v2">测进口风速<small>STEP 2</small></div>'
      +'<div class="st done" id="v3">测阻力<small>STEP 3</small></div>'
      +'<div class="st">测总效率<small>STEP 4</small></div>'
      +'<div class="st">测分级效率<small>STEP 5</small></div>'
      +'</div>'
      +'<div class="param" id="pm">进口风速 <b>18</b> m/s</div>'
      +'<div class="out" id="outB">已完成 STEP 1–3，可以继续测总效率。</div>'
      +'</div>';
  }
  function s3Void(){
    setOut(byId("pm"),'进口风速 <b class="old">18</b> → <b class="hl">26</b> m/s');
    ["v2","v3"].forEach(function(id){
      var el=byId(id);
      if(el){el.classList.remove("done");el.classList.add("void");}
    });
    setOut(byId("outB"),'<span class="no">⚠ 参数已变更</span><br>'
      +'STEP 2 · 测进口风速 与 STEP 3 · 测阻力 的测量数据<b>已作废</b>。'
      +'<span class="why">工况变了，旧数据和新工况对不上，必须重测。</span>');
  }

  function r4(){
    sceneEl.innerHTML='<div class="scene s4">'
      +'<div class="kick2">③ 数据异常，告诉你为什么</div>'
      +'<div class="rows">'
      +'<div class="row"><span>测点风速</span><b id="rv">3.2 m/s</b></div>'
      +'<div class="row"><span>断面平均流速</span><b>8.6 m/s</b></div>'
      +'<div class="row"><span>测点距壁距离</span><b>0.4 m</b></div>'
      +'</div>'
      +'<div class="out" id="outC">正在读取断面数据…</div>'
      +'</div>';
  }
  function s4Warn(){
    var el=byId("rv");
    if(el)el.classList.add("warn");
    setOut(byId("outC"),'<span class="no">⚠ 测点风速 3.2 m/s 明显低于断面平均 8.6 m/s</span>');
  }
  function s4Why(){
    setOut(byId("outC"),'<span class="no">⚠ 测点风速 3.2 m/s 明显低于断面平均 8.6 m/s</span>'
      +'<span class="why">测点落在涡流区，单点读数不代表断面平均流速。应先按等面积法重新布点，再重测——而不是把这一次的读数直接填进报告。</span>');
  }

  function r5(){
    sceneEl.innerHTML='<div class="scene s5">'
      +'<div class="kick2">这个站点里有什么</div>'
      +'<div class="grid">'
      +'<div class="cell"><b id="c1">0</b><span>个交互页面</span></div>'
      +'<div class="cell"><b>8</b><span>个方向</span></div>'
      +'<div class="cell"><b>0</b><span>外部依赖</span></div>'
      +'<div class="cell"><b>1</b><span>个文件 = 一页</span></div>'
      +'</div>'
      +'<div class="out">单文件 HTML，双击即用。不装插件、不注册，<b>断网也能跑</b>。</div>'
      +'</div>';
  }

  function r6(){
    sceneEl.innerHTML='<div class="scene center s6">'
      +'<div class="logo">Env<em>Lab</em></div>'
      +'<div class="url">song19850425.github.io/envlab-lab</div>'
      +'<div class="tags">高校环境类专业 · 上机实训 · 上岗培训 · 离线可用</div>'
      +'</div>';
  }

  var SCENES=[
    {t:0,     name:"钩子",         render:r1,
      nar:{at:400,  rate:1.08, text:"照着步骤点一遍，就算学会了？"}},
    {t:4000,  name:"跳过步骤被拦", render:r2, steps:[[1500,s2Tap],[3300,s2Block]],
      nar:{at:500,  rate:1.14, text:"这个网站不一样。你想跳过风速，直接测阻力？它会拦住你，还会告诉你为什么——没有风速，效率数据根本没法比较。"}},
    {t:20000, name:"参数变更作废", render:r3, steps:[[3200,s3Void]],
      nar:{at:500,  rate:1.14, text:"更狠的是这里。把进口风速从十八改成二十六，前面测出的数据立刻作废，逼你重测。工况变了，旧数据对不上。"}},
    {t:34000, name:"异常物理解释", render:r4, steps:[[1900,s4Warn],[3600,s4Why]],
      nar:{at:500,  rate:1.14, text:"测出异常值，它不只弹一个错误。它会告诉你，测点落在涡流区，单点读数不代表断面平均流速。"}},
    {t:46000, name:"站点规模",     render:r5,
      nar:{at:400,  rate:1.12, text:"这样的页面有八十八个，单文件网页，不装插件、不注册，断网也能跑。"}},
    {t:54000, name:"行动号召",     render:r6,
      nar:{at:300,  rate:1.10, text:"搜 EnvLab 环境监测交互实验，先点那个判错演示台。"}}
  ];

  var zhVoice=null,voiceOn=true;

  function pickVoice(){
    try{
      if(!window.speechSynthesis)return;
      var vs=window.speechSynthesis.getVoices()||[];
      if(!vs.length)return;
      var pref=[
        /Xiaoxiao.*(Natural|Online)/i,
        /Yunxi.*(Natural|Online)|Yunyang.*(Natural|Online)/i,
        /Microsoft (Xiaoxiao|Yunxi|Yunjian|Xiaoyi|Huihui|Yaoyao|Kangkang)/i,
        /Huihui|Yaoyao|Kangkang/i,
        /zh[-_]CN/i,
        /^zh/i
      ];
      for(var i=0;i<pref.length;i++){
        var hit=vs.filter(function(v){return pref[i].test(v.name+" "+v.lang);})[0];
        if(hit){zhVoice=hit;break;}
      }
    }catch(e){}
  }

  function speak(text,rate){
    if(!voiceOn||!text)return;
    var ss=window.speechSynthesis;
    if(!ss||typeof window.SpeechSynthesisUtterance!=="function")return;
    try{
      ss.cancel();
      var u=new window.SpeechSynthesisUtterance(text);
      u.lang="zh-CN";
      u.rate=rate||1.12;
      u.pitch=1;
      u.volume=1;
      if(zhVoice)u.voice=zhVoice;
      ss.speak(u);
    }catch(e){}
  }
  function hush(){try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}}
  function updateVoiceHud(){
    var el=document.getElementById("hudVoice");
    if(el)el.innerHTML="配音 "+(voiceOn?"<b>开</b>":"<b>关</b>");
  }

  var T=0,playing=false,last=0,cur=-1,fired={},done=false,hudTimer=null;
  var params=new URLSearchParams(location.search);
  var startAt=0;
  if(params.has("scene")){
    var n=parseInt(params.get("scene"),10);
    if(!isNaN(n)&&SCENES[n])startAt=SCENES[n].t;
  }
  if(params.has("t")){
    var ms=parseInt(params.get("t"),10);
    if(!isNaN(ms))startAt=Math.max(0,Math.min(TOTAL,ms));
  }
  T=startAt;

  function pad(v){return (v<10?"0":"")+v;}
  function fmt(ms){
    var s=Math.floor(Math.max(0,ms)/1000);
    return pad(Math.floor(s/60))+":"+pad(s%60);
  }
  function showHud(sticky){
    if(hudHidden)return;
    hud.classList.add("show");
    clearTimeout(hudTimer);
    if(!sticky)hudTimer=setTimeout(function(){hud.classList.remove("show");},2400);
  }
  var hudHidden=false;

  function fit(){
    var s=Math.min(window.innerWidth/1080,window.innerHeight/1920);
    stage.style.transform="scale("+s+")";
    stage.style.left=Math.max(0,(window.innerWidth-1080*s)/2)+"px";
    stage.style.top=Math.max(0,(window.innerHeight-1920*s)/2)+"px";
  }
  window.addEventListener("resize",fit);
  fit();

  function seekScene(i){
    i=Math.max(0,Math.min(SCENES.length-1,i));
    hush();
    T=SCENES[i].t;done=false;playing=true;cur=-1;last=0;showHud(true);
  }

  var gate=document.getElementById("gate");
  var started=false;
  function begin(withVoice){
    voiceOn=withVoice;
    started=true;
    gate.classList.add("hide");
    setTimeout(function(){gate.style.display="none";},380);
    T=startAt;cur=-1;done=false;last=0;
    playing=true;
    updateVoiceHud();
    showHud(true);
  }
  document.getElementById("gStart").addEventListener("click",function(){begin(true);});
  document.getElementById("gMute").addEventListener("click",function(){begin(false);});

  if(window.speechSynthesis){
    pickVoice();
    window.speechSynthesis.onvoiceschanged=function(){zhVoice=null;pickVoice();};
  }
  updateVoiceHud();
  if(params.get("auto")==="1")begin(false);
  else if(params.get("auto")==="0"){
    started=true;playing=false;
    gate.classList.add("hide");gate.style.display="none";
    showHud(true);
  }
  else showHud(true);

  function frame(ts){
    if(!last)last=ts;
    var dt=Math.min(90,ts-last);
    last=ts;
    if(playing&&!done)T=Math.min(TOTAL,T+dt);

    var idx=0;
    for(var i=0;i<SCENES.length;i++){if(T>=SCENES[i].t)idx=i;}
    if(idx!==cur){cur=idx;fired={};hush();SCENES[idx].render();}

    var sc=SCENES[idx];
    if(sc.nar&&T>=sc.t+sc.nar.at&&!fired.__nar){fired.__nar=1;speak(sc.nar.text,sc.nar.rate);}
    if(sc.steps){
      for(var j=0;j<sc.steps.length;j++){
        var key=idx+"_"+j;
        if(T>=sc.t+sc.steps[j][0]&&!fired[key]){fired[key]=1;sc.steps[j][1]();}
      }
    }
    if(idx===4){
      var c=byId("c1");
      if(c){
        var p=Math.max(0,Math.min(1,(T-sc.t-600)/1200));
        c.textContent=String(Math.round(p*88));
      }
    }
    prog.style.width=(T/TOTAL*100)+"%";
    hudScene.textContent="镜 "+(idx+1)+" / "+SCENES.length+" · "+sc.name;
    hudTime.textContent=fmt(T)+" / 01:00";
    if(T>=TOTAL){done=true;playing=false;showHud(true);}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener("mousemove",function(){showHud(false);});
  document.addEventListener("keydown",function(e){
    if(!started)return;
    if(e.code==="Space"){
      e.preventDefault();
      if(done){hush();T=0;done=false;playing=true;cur=-1;}
      else{
        playing=!playing;
        try{playing?window.speechSynthesis.resume():window.speechSynthesis.pause();}catch(err){}
      }
      last=0;showHud(true);
    }else if(e.key==="ArrowRight"){seekScene(cur+1);}
    else if(e.key==="ArrowLeft"){seekScene(cur-1);}
    else if(e.key==="r"||e.key==="R"){hush();T=0;done=false;playing=true;cur=-1;last=0;showHud(true);}
    else if(e.key==="v"||e.key==="V"){
      voiceOn=!voiceOn;
      if(!voiceOn)hush();
      updateVoiceHud();showHud(true);
    }
    else if(e.key==="h"||e.key==="H"){
      hudHidden=!hudHidden;
      if(hudHidden)hud.classList.remove("show");else showHud(true);
    }
  });
})();
</script>
</body>
</html>
