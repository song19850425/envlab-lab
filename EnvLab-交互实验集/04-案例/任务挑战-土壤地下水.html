    {id:"soil-groundwater",short:"地下水采样",title:"先让井况和现场参数稳定下来",skill:"地下水采样",intro:"监测井已经到达，但井内水体可能受施工、停留和抽排影响，不能把刚抽出的水直接当成稳定样品。",evidence:[["井况","近期维护过，井内水体状态需要重新确认"],["现场观察","水位、浊度和现场参数仍在变化"],["采样目标","希望样品反映井周地下水，而不是井内扰动水体"]],question:"采样前最重要的判断是什么？",options:[{text:"按项目方案进行洗井或置换，持续观察现场参数和水样状态，达到预设稳定条件后再采样。",correct:true,feedback:"地下水样品的代表性需要和井况、现场参数稳定性一起确认，不能只看抽出水量。",impact:"这一步避免把施工扰动带进分析结果。"},{text:"抽满 3 倍井体积水后直接采样，用抽水体积代替参数稳定判断。",correct:false,feedback:"井体积倍数只是经验做法，现场参数稳定才是代表性的判据；抽够 3 倍体积不保证水质已经稳定。",impact:"错误能力点：地下水采样。"},{text:"便携设备测 pH、电导率正常后即可采样，浊度变化可以不看。",correct:false,feedback:"浊度反映颗粒物扰动，是稳定性指标之一；挑指标看等于主动丢掉一部分证据。",impact:"错误能力点：地下水采样。"}]},
    {id:"soil-integrity",short:"样品完整性",title:"避免把现场操作变成新的污染源",skill:"样品完整性",intro:"多个点位连续采样，土壤、地下水和不同目标因子的容器与保存要求并不完全相同。",evidence:[["现场风险","工具、手套、容器和采样顺序可能造成交叉污染"],["样品信息","点位、深度、介质、时间和保存条件必须对应"],["操作要求","空白、清洗或去污记录应按方案留痕"]],question:"哪种操作最能保护样品证据？",options:[{text:"按方案执行采样顺序和工具去污，分介质标识与保存，现场核对编号、深度、时间和记录。",correct:true,feedback:"样品完整性既取决于容器和保存，也取决于工具、顺序和原始记录。",impact:"这一步防止调查结果被现场操作本身污染。"},{text:"按浓度从低到高的顺序采样，这样同一套工具可以不经清洗连续使用。",correct:false,feedback:"由低到高是正确的采样顺序，但它不能替代工具去污——现场空白就是用来抓这种残留的。",impact:"错误能力点：样品完整性。"},{text:"所有样品统一用一种采样瓶、一种保存方式，简化现场操作、减少差错。",correct:false,feedback:"土壤、地下水、不同目标因子的容器和保存要求并不相同；统一简化会毁掉其中一部分样品。",impact:"错误能力点：样品完整性。"}]},
    {id:"soil-qc",short:"调查质控",title:"用质控识别现场和实验室的假信号",skill:"调查质控",intro:"实验室出现一个偏高结果，但现场空白、运输记录和样品保存状态还没有一起核对。",evidence:[["异常信号","一个样品结果明显高于相邻点位"],["待核对记录","现场空白、运输空白、容器批次和保存时间"],["关键问题","高结果来自地块污染，还是来自过程污染尚未确定"]],question:"面对这个异常结果，首先应该怎么做？",options:[{text:"保留原始结果，联动核查空白、容器、运输、保存和实验室质控，再决定复测或补充采样。",correct:true,feedback:"异常结果需要和全过程质控一起解释，不能只看空间位置或数字大小。",impact:"质控的作用是帮助区分真实信号与过程引入的信号。"},{text:"立即复测一次，看高值是否重复出现，用重复性说话。",correct:false,feedback:"复测只能回答“实验室稳不稳定”，回答不了“污染来自过程还是地块”——空白样和运输记录才是溯源的钥匙。",impact:"错误能力点：调查质控。"},{text:"把相邻点位加急送检，用空间加密数据压住这个异常。",correct:false,feedback:"加密解决的是空间代表性问题，不是质控问题；过程污染不查清，加再多点位也是可疑数据。",impact:"错误能力点：调查质控。"}]},
    {id:"soil-spatial",short:"空间解释",title:"让空间差异推动下一步调查",skill:"空间解释",intro:"多个点位已经有初步结果，源区较高、下游有下降趋势，但边界和深度仍存在空白。直接在图上圈出下一步的靶区。",evidence:[["空间信息","源区、边界、下游和背景点结果不完全一致"],["缺口","地块边界和某一深度层的点位较少"],["教学目标","决定是否需要补充点位或调整概念模型"]],question:"哪几个区域最需要补充调查？",interactive:{
      hint:"点击选择需要补充调查的区域（可多选），然后提交。点位浓度为教学虚构值（mg/kg）。",
      submit:"提交判断",
      svg:'<svg viewBox="0 0 640 430" role="img" aria-label="点位浓度与补充调查示意图"><rect x="40" y="30" width="560" height="370" rx="10" fill="rgba(148,184,218,.05)" stroke="#5b7a99" stroke-width="2"/><text x="56" y="58" fill="#8fa9c2" font-size="13">疑似污染地块边界</text><rect x="120" y="180" width="170" height="130" rx="8" fill="rgba(251,113,133,.07)" stroke="#fb7185" stroke-dasharray="6 4" stroke-width="1.5"/><defs><marker id="arwS2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4f2"/></marker></defs><line x1="330" y1="372" x2="540" y2="372" stroke="#7cc4f2" stroke-width="2" marker-end="url(#arwS2)"/><text x="400" y="362" fill="#7cc4f2" font-size="12">地下水流向</text><g><rect x="183" y="232" width="46" height="30" rx="6" fill="rgba(251,113,133,.22)" stroke="#fb7185" stroke-width="1.5"/><text x="206" y="252" text-anchor="middle" fill="#ffd0d8" font-size="13" font-weight="700">860</text><text x="206" y="280" text-anchor="middle" fill="#9bb1c8" font-size="11">S1 源区</text></g><g><rect x="307" y="232" width="46" height="30" rx="6" fill="rgba(251,113,133,.14)" stroke="#fb7185" stroke-width="1.5"/><text x="330" y="252" text-anchor="middle" fill="#ffd0d8" font-size="13" font-weight="700">240</text><text x="330" y="280" text-anchor="middle" fill="#9bb1c8" font-size="11">S2 边缘</text></g><g><rect x="517" y="152" width="46" height="30" rx="6" fill="rgba(251,191,36,.14)" stroke="#fbbf24" stroke-width="1.5"/><text x="540" y="172" text-anchor="middle" fill="#ffe6a3" font-size="13" font-weight="700">95</text><text x="540" y="198" text-anchor="middle" fill="#9bb1c8" font-size="11">B1 边界</text></g><g><rect x="447" y="312" width="46" height="30" rx="6" fill="rgba(148,184,218,.14)" stroke="#b7d3e8" stroke-width="1.5"/><text x="470" y="332" text-anchor="middle" fill="#d8f4ff" font-size="13" font-weight="700">38</text><text x="470" y="358" text-anchor="middle" fill="#9bb1c8" font-size="11">D1 下游</text></g><g><rect x="107" y="92" width="46" height="30" rx="6" fill="rgba(52,211,153,.14)" stroke="#34d399" stroke-width="1.5"/><text x="130" y="112" text-anchor="middle" fill="#9eeacb" font-size="13" font-weight="700">11</text><text x="130" y="138" text-anchor="middle" fill="#9bb1c8" font-size="11">BG 背景</text></g><g data-pick="R1"><rect class="pick-dot" x="498" y="48" width="124" height="96" rx="8" fill="rgba(167,139,250,.07)" stroke="#a78bfa" stroke-dasharray="7 4" stroke-width="2"/><text class="pick-label" x="560" y="88" text-anchor="middle" fill="#c9b8f5" font-size="13" font-weight="700">R1</text><text x="560" y="108" text-anchor="middle" fill="#9bb1c8" font-size="11">边界外验证区</text></g><g data-pick="R2"><rect class="pick-dot" x="292" y="336" width="140" height="52" rx="8" fill="rgba(167,139,250,.07)" stroke="#a78bfa" stroke-dasharray="7 4" stroke-width="2"/><text class="pick-label" x="362" y="358" text-anchor="middle" fill="#c9b8f5" font-size="13" font-weight="700">R2</text><text x="362" y="376" text-anchor="middle" fill="#9bb1c8" font-size="11">下游远端/深层</text></g><g data-pick="R3"><rect class="pick-dot" x="140" y="196" width="150" height="112" rx="8" fill="rgba(167,139,250,.07)" stroke="#a78bfa" stroke-dasharray="7 4" stroke-width="2"/><text class="pick-label" x="215" y="216" text-anchor="middle" fill="#c9b8f5" font-size="13" font-weight="700">R3</text><text x="215" y="292" text-anchor="middle" fill="#9bb1c8" font-size="11">源区内部加密</text></g></svg>',
      check:function(ids){
        var need=["R1","R2"];
        if(ids.indexOf("R3")>=0)return{ok:false,body:"R3 源区已有 S1(860)、S2(240) 两个点，再加密回答不了边界和迁移前锋的问题——钱要花在未知的地方，而不是已知的地方。",impact:"错误能力点：空间解释。"};
        var miss=need.filter(function(k){return ids.indexOf(k)<0;});
        if(miss.length){
          var why="";
          if(miss.indexOf("R1")>=0)why+="R1 东部边界外仍是空白，污染范围没有闭环；";
          if(miss.indexOf("R2")>=0)why+="R2 下游远端与深层没有验证，迁移前锋说不清；";
          return{ok:false,body:"还缺"+miss.join("、")+"。"+why,impact:"错误能力点：空间解释。"};
        }
        return{ok:true,body:"R1 补上边界空白，R2 验证迁移前锋与深层——这两处正是概念模型里没闭环的地方。下一步采样有了明确靶子。",impact:"好的调查会让下一轮采样更有针对性。"};
      }
    }},
    {id:"soil-conclusion",short:"调查结论",title:"把调查结论写成证据边界",skill:"结论表达",intro:"调查阶段即将结束。现在需要把已知、未知、数据质量状态和下一步行动分开表达。",evidence:[["已有证据","历史资料、采样点、检测结果、质控和空间趋势"],["未闭环事项","部分边界、深度和迁移路径仍需验证"],["教学边界","本页不直接做污染认定或修复范围决策"]],question:"哪种结论表达最稳妥？",options:[{text:"说明已验证的范围与趋势、数据质量状态和剩余不确定性，并提出与证据对应的下一步调查。",correct:true,feedback:"调查结论要让读者看见证据边界：哪些已经支持，哪些还不能支持。",impact:"任务完成：你把调查设计、样品证据和下一步行动连起来了。"},{text:"按最保守原则，把所有不确定的区域都划入疑似污染范围。",correct:false,feedback:"保守不等于科学；没有证据支撑的范围扩大，和没有证据的排除一样，都是不负责任的结论。",impact:"错误能力点：结论表达。"},{text:"结论只写已经确认的部分，不确定的内容一律不写入报告。",correct:false,feedback:"不写不等于不存在；把剩余不确定性如实写出来，比给出过度确定的结论更可靠。",impact:"错误能力点：结论表达。"}]},
    {id:"soil-budget",short:"资源取舍",title:"预算只够打 8 口井，砍哪 4 个",skill:"资源取舍",intro:"12 个候选点位，预算和工期只够完成 8 个。监管底线是：背景、源区、边界、下游四类验证不能整类缺席。",evidence:[["候选点位","12 个：背景 2、源区 4（含 2 个内部加密）、边界 3、下游 3"],["预算工期","只能完成 8 个，多一口都没有"],["底线要求","背景、源区、边界、下游四类验证点不能整类砍掉"]],question:"哪种取舍最站得住脚？",options:[{text:"保住背景、源区代表点、边界和下游验证点，砍掉源区内部加密点和重复深度。",correct:true,feedback:"取舍的原则是保“问题”不保“数量”：四类验证回答四个不同的问题，内部加密回答的是同一个问题的第二遍。",impact:"预算约束下，砍的是重复验证，不是问题本身。"},{text:"12 个点每个区域平均砍，保证图面上各类点位都还剩一点。",correct:false,feedback:"平均用力等于没有优先级；边界只剩象征性点位时，范围问题依然回答不了。",impact:"错误能力点：资源取舍。"},{text:"砍掉背景点和下游点，集中火力把源区查透，钱花在刀刃上。",correct:false,feedback:"背景点是全部数据的对照基准，下游点验证迁移路径；砍掉它们，源区数据再密也解释不清。",impact:"错误能力点：资源取舍。"},{text:"砍掉边界验证点，边界以后二期再说，先把场内搞清楚。",correct:false,feedback:"边界不清，污染范围就没有闭环；“以后再说”往往意味着结论里藏着一个大窟窿。",impact:"错误能力点：资源取舍。"}]}
  ],
