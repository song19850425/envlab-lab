  intro:"从方法和样品基体确认开始，经过仪器准备、校准质控、异常识别和复测决策，练习如何让一个分析结果具备可追溯性。",
  caseIntro:"实验室收到一批教学样品，目标是完成定量分析。校准、空白、样品前处理和谱图状态互相牵连，你需要判断哪个证据应该先查。",
  disclaimer:"本页使用虚构仪器状态、谱图现象和教学数据。具体仪器的气源、真空、温度、流动相、校准和关机顺序必须以对应机型标准操作规程、方法文件和实验室质量体系为准；本页不替代上机授权考核。",
  startNote:"看到异常峰、漂移或一个不合理数字时，不要马上重跑或删除结果。先确定异常现象，再选择信息量最大的验证动作。",
  duration:"8 分钟",
  accent:"#38bdf8",
  accentSoft:"rgba(56,189,248,.13)",

  ],
  steps:[
    {id:"inst-method",short:"方法基体",title:"先确认这个结果要回答什么",skill:"方法与基体",intro:"同一台仪器可以分析不同对象，但方法、基体、量程和前处理并不自动通用。",evidence:[["任务目标","测定一批教学样品中的目标因子"],["待核对信息","样品基体、目标范围、前处理和定量方法"],["当前风险","直接套用另一批样品方法会导致干扰或量程不匹配"]],question:"上机前最应该先确认什么？",options:[{text:"核对目标因子、样品基体、方法文件、量程、稀释和前处理要求，再安排分析序列。",correct:true,feedback:"方法和基体决定仪器条件、校准范围、前处理和结果表达，不能只看仪器名称。",impact:"这一步把“能测”与“测得可解释”区分开。"},{text:"只要仪器型号相同，就可以直接复用上一批序列和校准。",correct:false,feedback:"样品基体、量程和方法条件变化时，上一批设置可能不再适用。",impact:"错误能力点：方法与基体。"},{text:"先把所有样品跑一遍，看到异常再补查方法和稀释。",correct:false,feedback:"事后补查可能已经消耗样品并产生一批无法解释的结果，应在上机前确认。",impact:"错误能力点：方法与基体。"}]},
    {id:"inst-ready",short:"仪器准备",title:"把仪器状态确认成可测状态",skill:"仪器准备",intro:"仪器可以开机，但气源、真空、温度、流路或基线状态并未全部确认。",evidence:[["状态提示","仪器自检完成，但关键工作条件仍需人工核对"],["机型差异","不同仪器和方法的前置条件不同"],["教学提醒","具体顺序必须回到对应机型标准操作规程"]],question:"哪种准备方式最稳妥？",options:[{text:"按具体机型标准操作规程 核对气源、真空、温度、流路、灯源或其他方法前提，并完成稳定性确认。",correct:true,feedback:"“已开机”不等于“可以测量”；工作条件需要和方法、机型以及当前序列对应。",impact:"仪器状态是每个结果的隐形前提。"},{text:"看到软件界面正常就直接进样，稳定时间可以省略。",correct:false,feedback:"界面可操作不代表基线、温度或流路已经稳定，省略准备会放大漂移和重复性问题。",impact:"错误能力点：仪器准备。"},{text:"沿用上次实验的气源和流路状态，不必再检查连接。",correct:false,feedback:"上次状态不能替代本次确认，连接和耗材变化都可能带来安全或数据风险。",impact:"错误能力点：仪器准备。"}]},
    {id:"inst-cal",short:"校准质控",title:"先证明定量关系，再接收样品结果",skill:"校准与质控",intro:"校准曲线已经生成，但空白、标准核查和质量控制样品的状态还没有一起判断。",evidence:[["已有输出","校准曲线和样品序列已准备"],["待确认","空白、校准核查、重复性和必要质控结果"],["关键问题","曲线看起来漂亮，不代表整个批次都可用"]],question:"哪种顺序最符合结果可信度要求？",options:[{text:"先按方法核查空白、校准状态和质量控制结果，确认批次条件满足后再解释样品结果。",correct:true,feedback:"校准只解决定量关系的一部分，空白、核查和重复性共同决定批次是否可接受。",impact:"这一步避免把“有曲线”误认为“所有结果都可靠”。"},{text:"只要相关性看起来很好，就可以忽略空白和质控结果。",correct:false,feedback:"相关性不能识别污染、漂移或批次过程异常，质量控制仍需单独判断。",impact:"错误能力点：校准与质控。"},{text:"先报告样品结果，质控表格等全部结束后再补。",correct:false,feedback:"结果解释和质量状态应同步建立，事后补表不能改变已经发生的分析过程。",impact:"错误能力点：校准与质控。"}]},
    {id:"inst-anomaly",short:"谱图异常",title:"把异常现象拆成可验证的假设",skill:"异常识别",intro:"样品谱图出现基线漂移和一个额外峰，重复进样后现象仍未完全消失。",evidence:[["现象","基线变化、额外峰和重复性线索同时出现"],["可能来源","溶剂、污染、基体干扰、进样、流路或仪器状态"],["当前限制","还没有对照空白、标准和新制样结果"]],question:"下一步哪种验证最有信息量？",options:[{text:"保留原始谱图，依次检查空白、标准、进样记录、流路和样品前处理，并设计对照验证。",correct:true,feedback:"先把现象记录下来，再用空白、标准和过程记录拆分可能来源，而不是凭图形直接定性。",impact:"异常诊断的目标是缩小原因范围，并保留每一步证据。"},{text:"只挑选峰形最好的一次结果，把其他谱图删除。",correct:false,feedback:"删除异常谱图会破坏诊断线索，也不能证明最好的一次代表真实状态。",impact:"错误能力点：异常识别。"},{text:"先提高信号增益或改参数，直到额外峰消失。",correct:false,feedback:"盲目改参数可能掩盖异常来源，且会让前后结果失去可比性。",impact:"错误能力点：异常识别。"}]},
    {id:"inst-repeat",short:"复测决策",title:"选择能区分原因的复测动作",skill:"复测决策",intro:"空白也出现了类似额外峰，标准响应发生轻微变化；样品本身是否异常还不能确定。",evidence:[["对照线索","空白与样品出现相似现象"],["标准状态","标准响应与此前序列有变化"],["待判断","应优先重做样品、重配溶液，还是检查系统"]],question:"此时哪种动作更合理？",options:[{text:"先冻结批次解释，检查空白、标准、流路和试剂，再根据证据决定清洗、重配或重新进样。",correct:true,feedback:"当空白和标准也异常时，优先排查系统和过程因素，不能只重跑一份样品。",impact:"复测应该能区分原因，而不是单纯重复点击进样。"},{text:"只重跑样品，样品结果正常就说明仪器没有问题。",correct:false,feedback:"空白和标准已经提供了系统异常线索，单独重跑样品无法排除系统因素。",impact:"错误能力点：复测决策。"},{text:"直接删除本批空白和标准记录，只保留样品结果。",correct:false,feedback:"质量控制记录必须保留；删除它们会让批次失去可追溯性。",impact:"错误能力点：复测决策。"}]},
    {id:"inst-trace",short:"结果追溯",title:"让每一个数字都能回到原始记录",skill:"结果追溯",intro:"样品结果已经导出，但稀释倍数、校准批次、单位和进样序列还散落在不同记录里。",evidence:[["结果字段","浓度、单位、稀释倍数和样品编号"],["关联记录","校准批次、原始谱图、进样顺序和质控状态"],["当前风险","换算或复制时可能发生样品错配和单位错误"]],question:"整理结果时最重要的动作是什么？",options:[{text:"把样品编号、原始信号、校准批次、稀释倍数、单位和质控状态建立一一对应。",correct:true,feedback:"追溯链闭合后，复核者才能从报告数字回到原始信号和质量状态。",impact:"结果可信度不仅来自计算，也来自可回查。"},{text:"只保留最后的浓度列，其他中间记录会让报告太复杂。",correct:false,feedback:"没有原始信号、稀释和批次信息，无法复核单位、换算和样品归属。",impact:"错误能力点：结果追溯。"},{text:"按样品名称排序后复制结果，不必再核对进样序列。",correct:false,feedback:"名称相似或序列变更时容易错配，排序不能替代编号和原始记录核对。",impact:"错误能力点：结果追溯。"}]},
    {id:"inst-report",short:"报告表达",title:"把异常、限制和结果一起说清楚",skill:"报告表达",intro:"最终数据已经整理，但异常处置、质量状态和方法限制仍然需要进入报告或原始记录。",evidence:[["已有信息","结果、原始谱图、质控、复测和异常处置记录"],["需要表达","使用条件、单位、定量范围、异常限制和是否可用于任务目的"],["教学边界","本页不直接生成任何正式合格或不合格结论"]],question:"哪种结果表达最稳妥？",options:[{text:"报告结果、单位、换算和质控状态，注明异常处置与限制；必要时对受影响结果加说明或不作直接结论。",correct:true,feedback:"仪器分析报告应让读者同时看到数字和数字的条件，异常不能被隐藏在最终表格之外。",impact:"任务完成：你把方法、仪器、质量控制和报告边界连起来了。"},{text:"只报告重跑后最接近预期的结果，异常过程不必呈现。",correct:false,feedback:"选择性报告会掩盖过程信息，无法让复核者判断结果为什么被接受。",impact:"错误能力点：报告表达。"},{text:"只要软件给出数值，就直接写成样品真实浓度，不需要质量状态说明。",correct:false,feedback:"软件输出不等于无条件可用的报告结果，方法和质控状态仍然决定解释边界。",impact:"错误能力点：报告表达。"}]}
