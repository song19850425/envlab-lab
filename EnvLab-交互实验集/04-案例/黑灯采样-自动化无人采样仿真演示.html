<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>黑灯采样 · 无人化采样全流程仿真 | EnvLab</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:#0a0a12;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#c0d0e0;
    display:flex;flex-direction:column;
    user-select:none;
  }
  /* ===== HEADER ===== */
  .hd{
    padding:12px 18px 8px;
    border-bottom:1px solid rgba(0,200,255,0.15);
    display:flex;align-items:center;gap:12px;
  }
  .hd .logo{
    font-size:13px;font-weight:800;
    background:linear-gradient(90deg,#00c8ff,#ff2d78);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    letter-spacing:.12em;
  }
  .hd .tag{
    font-size:11px;color:#6a7a8a;
    border:1px solid #2a3a4a;border-radius:4px;padding:2px 8px;
  }
  .hd .status{
    margin-left:auto;
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:#6a7a8a;
  }
  .st-dot{
    width:8px;height:8px;border-radius:50%;
    background:#4aff6a;box-shadow:0 0 6px #4aff6a66;
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

  /* ===== MAIN LAYOUT ===== */
  .main{
    flex:1;display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }
  /* ===== MAP AREA ===== */
  .map{
    flex:1;position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(0,150,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(255,45,120,0.03) 0%, transparent 50%),
      #0d0d18;
  }
  /* terrain */
  .terrain{position:absolute;inset:0;pointer-events:none}
  .grid-line{position:absolute;background:rgba(0,200,255,0.04)}
  /* ===== BASE CAR ===== */
  .base-car{
    position:absolute;bottom:18%;left:12%;
    width:80px;height:44px;
    transition:all 0.8s cubic-bezier(0.34,1.5,0.64,1);
  }
  .base-car .body{
    width:80px;height:24px;
    background:linear-gradient(135deg,#1a2a3a,#0f1a28);
    border:1.5px solid #00c8ff;border-radius:6px 6px 3px 3px;
    position:relative;box-shadow:0 0 12px rgba(0,200,255,0.2);
  }
  .base-car .body::after{
    content:'';position:absolute;top:4px;left:8px;right:8px;
    height:6px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#00c8ff33,transparent);
  }
  .base-car .cab{
    position:absolute;right:-8px;top:-6px;
    width:22px;height:16px;
    background:linear-gradient(135deg,#0f1a28,#0a0f1a);
    border:1.5px solid #00c8ff;border-radius:5px 5px 2px 2px;
  }
  .base-car .cab::after{
    content:'';position:absolute;top:2px;left:4px;right:4px;
    height:3px;border-radius:1px;
    background:linear-gradient(90deg,#00c8ff,#ff2d78);
    animation:scanner 2s ease-in-out infinite;
  }
  @keyframes scanner{0%,100%{opacity:0.3}50%{opacity:1}}
  .base-car .wheels{
    position:absolute;bottom:-5px;left:8px;right:8px;
    display:flex;justify-content:space-between;
  }
  .base-car .wheel{
    width:8px;height:10px;border-radius:3px;
    background:#2a3a4a;border:1px solid #4a5a6a;
  }
  .base-car .label{
    position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
    font-size:9px;color:#4a7a9a;white-space:nowrap;letter-spacing:.08em;
  }
  /* ===== DRONE ===== */
  .drone{
    position:absolute;
    width:28px;height:16px;
    transition:all 1.2s cubic-bezier(0.34,1,0.64,1);
    pointer-events:none;
    z-index:10;
  }
  .drone .frame{
    width:28px;height:12px;
    background:linear-gradient(135deg,#1a2a3a,#0f1a28);
    border:1.5px solid #ff2d78;border-radius:4px;
    position:relative;box-shadow:0 0 8px rgba(255,45,120,0.25);
    display:flex;align-items:center;justify-content:center;
  }
  .drone .frame::before,.drone .frame::after{
    content:'';position:absolute;top:-3px;
    width:6px;height:3px;border-radius:1px;
    background:rgba(255,45,120,0.4);
  }
  .drone .frame::before{left:2px}
  .drone .frame::after{right:2px}
  .drone .light{
    width:3px;height:3px;border-radius:50%;
    background:#4aff6a;box-shadow:0 0 6px #4aff6a88;
    animation:blink 0.4s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  .drone .shadow{
    position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
    width:14px;height:4px;border-radius:50%;
    background:rgba(255,45,120,0.08);
  }
  /* ===== SAMPLING POINTS ===== */
  .spot{
    position:absolute;cursor:pointer;pointer-events:none;
    transition:all 0.3s;
  }
  .spot .icon{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    border:2px solid rgba(0,200,255,0.25);
    background:rgba(0,200,255,0.06);
    position:relative;
  }
  .spot .pulse-ring{
    position:absolute;inset:-4px;border-radius:50%;
    border:1px solid rgba(0,200,255,0.1);
    animation:ring 3s ease-in-out infinite;
  }
  @keyframes ring{0%,100%{transform:scale(1);opacity:0.3}50%{transform:scale(1.3);opacity:0}}
  .spot .name{
    position:absolute;top:100%;left:50%;transform:translateX(-50%);
    font-size:9px;color:#4a7a9a;white-space:nowrap;margin-top:4px;
  }
  .spot.active .icon{border-color:#ff2d78;background:rgba(255,45,120,0.12)}
  .spot.done .icon{border-color:#4aff6a;background:rgba(74,255,106,0.1)}
  .spot.done .icon::after{
    content:'✓';position:absolute;top:-6px;right:-6px;
    font-size:10px;color:#4aff6a;
  }

  /* ===== STAGE BAR ===== */
  .stage-bar{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:0;
    background:rgba(10,10,18,0.85);
    border:1px solid rgba(0,200,255,0.12);
    border-radius:10px;padding:6px 12px;
    backdrop-filter:blur(8px);
    z-index:20;
  }
  .sb-step{
    display:flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:6px;
    font-size:11px;color:#5a6a7a;
    transition:all 0.3s;
    cursor:pointer;
  }
  .sb-step .num{
    width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    border:1px solid #2a3a4a;color:#4a5a6a;
    transition:all 0.3s;
  }
  .sb-step.active{color:#c0d0e0;background:rgba(0,200,255,0.06)}
  .sb-step.active .num{
    background:linear-gradient(135deg,#00c8ff,#ff2d78);
    border-color:transparent;color:#fff;
  }
  .sb-step.done{color:#4aff6a}
  .sb-step.done .num{border-color:#4aff6a;color:#4aff6a}
  .sb-arrow{font-size:10px;color:#2a3a4a;padding:0 2px}

  /* ===== INFO PANEL ===== */
  .panel{
    position:absolute;bottom:18%;right:6%;
    width:280px;
    background:rgba(10,10,18,0.88);
    border:1px solid rgba(0,200,255,0.12);
    border-radius:10px;padding:16px 18px;
    backdrop-filter:blur(10px);
    z-index:15;
    transition:all 0.5s cubic-bezier(0.34,1.2,0.64,1);
  }
  .panel-h{
    font-size:11px;color:#4a7a9a;letter-spacing:.1em;
    margin-bottom:8px;font-weight:700;
    text-transform:uppercase;
  }
  .panel-title{
    font-size:17px;font-weight:800;
    background:linear-gradient(90deg,#c0d0e0,#8aa0b0);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:6px;
  }
  .panel-desc{
    font-size:13px;color:#6a8a9a;line-height:1.7;margin-bottom:12px;
  }
  .panel-data{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
  }
  .pd-item{
    background:rgba(0,200,255,0.04);
    border-radius:6px;padding:8px 10px;
  }
  .pd-label{
    font-size:9px;color:#4a6a7a;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:2px;
  }
  .pd-val{
    font-size:14px;font-weight:700;color:#c0d0e0;
  }
  .pd-val.good{color:#4aff6a}
  .pd-val.warn{color:#ffaa00}

  /* ===== CONTROLS ===== */
  .ctrl{
    padding:10px 18px 14px;
    border-top:1px solid rgba(0,200,255,0.08);
    display:flex;align-items:center;gap:12px;
    background:rgba(10,10,18,0.6);
  }
  .ctrl .info{
    font-size:11px;color:#4a6a7a;flex:1;
  }
  .btn{
    padding:8px 22px;border:none;border-radius:8px;
    font-size:13px;font-weight:700;
    cursor:pointer;transition:all 0.25s;
    letter-spacing:.04em;
  }
  .btn-primary{
    background:linear-gradient(135deg,#00c8ff,#ff2d78);
    color:#fff;
  }
  .btn-primary:hover{transform:scale(1.04);box-shadow:0 0 16px rgba(255,45,120,0.3)}
  .btn-primary:disabled{opacity:0.3;cursor:default;transform:none}
  .btn-ghost{
    background:transparent;border:1px solid #2a3a4a;color:#6a7a8a;
  }
  .btn-ghost:hover{border-color:#4a5a6a;color:#8aa0b0}

  /* ===== FLOW TRAIL ===== */
  .flow-trail{
    position:absolute;inset:0;pointer-events:none;z-index:1;
  }
  .trail-dot{
    position:absolute;width:4px;height:4px;border-radius:50%;
    background:rgba(0,200,255,0.15);transition:all 0.3s;
  }
  .trail-dot.lit{background:rgba(0,200,255,0.5);box-shadow:0 0 6px rgba(0,200,255,0.2)}

  /* ===== LAB ANIMATION ===== */
  .lab{
    position:absolute;bottom:4%;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;
    opacity:0;transition:all 0.8s;
    font-size:10px;color:#4a6a7a;
  }
  .lab.show{opacity:1}
  .lab-node{
    padding:4px 10px;border-radius:4px;
    background:rgba(0,200,255,0.04);
    border:1px solid rgba(0,200,255,0.08);
    font-size:9px;color:#5a7a8a;
  }
  .lab-arrow{font-size:8px;color:#2a3a4a}

  /* ===== RESPONSIVE ===== */
  @media(max-width:640px){
    .panel{width:220px;right:4%;bottom:22%;}
    .panel .panel-data{grid-template-columns:1fr}
    .stage-bar{font-size:9px;padding:4px 6px;top:8px}
    .sb-step{padding:2px 5px;font-size:9px}
    .sb-step .num{width:14px;height:14px;font-size:8px}
    .base-car{width:56px;height:32px}
    .base-car .body{width:56px;height:18px}
    .drone{width:20px;height:12px}
    .spot .icon{width:24px;height:24px;font-size:12px}
    .ctrl{flex-wrap:wrap}
    .ctrl .btn{padding:6px 12px;font-size:11px}
  }
</style>
</head>
<body>

<div class="hd">
  <span class="logo">▊ EnvLab</span>
  <span class="tag">黑灯采样 仿真 v0.1</span>
  <span class="status"><span class="st-dot"></span>系统就绪</span>
</div>

<div class="main" id="app">
  <!-- stage bar -->
  <div class="stage-bar" id="stageBar"></div>

  <!-- map -->
  <div class="map" id="map">
    <!-- terrain -->
    <div class="terrain" id="terrain"></div>
    <!-- flow trail -->
    <svg class="flow-trail" id="flowTrail" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none"></svg>
    <!-- base car -->
    <div class="base-car" id="baseCar" style="bottom:18%;left:10%">
      <div class="body"><div class="cab"></div></div>
      <div class="wheels"><div class="wheel"></div><div class="wheel"></div></div>
      <div class="label">▣ BASE 指挥车</div>
    </div>
    <!-- drone -->
    <div class="drone" id="drone" style="bottom:18%;left:13%;opacity:0">
      <div class="frame"><div class="light"></div></div>
      <div class="shadow"></div>
    </div>
    <!-- sampling spots -->
    <div class="spot" id="spot0" style="bottom:55%;left:38%">
      <div class="icon"><span class="pulse-ring"></span>🌊</div>
      <div class="name">地表水采样点 A</div>
    </div>
    <div class="spot" id="spot1" style="bottom:45%;left:68%">
      <div class="icon"><span class="pulse-ring"></span>💨</div>
      <div class="name">环境空气采样点 B</div>
    </div>
    <div class="spot" id="spot2" style="bottom:65%;left:82%">
      <div class="icon"><span class="pulse-ring"></span>🔊</div>
      <div class="name">噪声监测点 C</div>
    </div>
    <!-- lab icon -->
    <div class="lab" id="labStatus">
      <span class="lab-node">🧪 样品交接</span>
      <span class="lab-arrow">→</span>
      <span class="lab-node">❄️ 冷链暂存</span>
      <span class="lab-arrow">→</span>
      <span class="lab-node">🏛 实验室接收</span>
    </div>
  </div>

  <!-- info panel -->
  <div class="panel" id="panel">
    <div class="panel-h">当前阶段</div>
    <div class="panel-title" id="panelTitle">就绪</div>
    <div class="panel-desc" id="panelDesc">点击"开始演示" 查看无人化采样全流程</div>
    <div class="panel-data" id="panelData">
      <div class="pd-item"><div class="pd-label">系统状态</div><div class="pd-val good">待命</div></div>
      <div class="pd-item"><div class="pd-label">样品数</div><div class="pd-val">0 / 3</div></div>
    </div>
  </div>
</div>

<!-- controls -->
<div class="ctrl">
  <div class="info" id="ctrlInfo">7 阶段流程 · 点击运行模拟</div>
  <button class="btn btn-ghost" id="btnReset" onclick="resetSim()">⟳ 重置</button>
  <button class="btn btn-primary" id="btnNext" onclick="nextStep()">▶ 开始演示</button>
</div>

<script>
const STAGES = [
  { id: 'arrive',  name: '到站',    icon: '🚐', title: 'BASE 指挥车抵达',
    desc: '无人化采样车抵达任务区域，自动展开采样平台。车载冰箱已预冷至 4°C，固定剂试剂已就位。' },
  { id: 'launch',  name: '释放',    icon: '🚀', title: '释放采样无人机 / 机器狗',
    desc: '从车顶自动释放多旋翼无人机，搭载可更换采样仓（水样瓶×6、空气吸附管×3、声级计×1）。无人机续航半径 5km。' },
  { id: 'nav',     name: '巡航',    icon: '🗺️', title: '自主导航至采样点',
    desc: '无人机按预置 GPS 坐标自主飞行至采样点。RTK 定位精度 ±2cm，实时回传 4K 画面与风速风向数据。' },
  { id: 'sample',  name: '采样',    icon: '🧪', title: '全自动采样',
    desc: '到达点位后，机械臂自动切换采样模式：水样（泵吸+瓶切换）、空气（吸附管自动更换）、噪声（伸出高精度声级计）。每点采样 3 组平行样。' },
  { id: 'preserv', name: '保存',    icon: '🧊', title: '自动加入固定剂 + 冷链封存',
    desc: '采样完成即刻自动注入对应固定剂（根据样品类型从 6 种预充试剂中选择），RFID 标签记录时间/坐标/固定剂批号。封口后转入机载 4°C 恒温箱。' },
  { id: 'return',  name: '返航',    icon: '↩️', title: '返航并交接样品',
    desc: '完成全部点位后自动返航至 BASE 车。降落时机械臂将采样仓对接至车载流转箱，生成数字交接单（含不可篡改的时间戳+温湿度记录）。' },
  { id: 'lab',     name: '流转',    icon: '🏛️', title: '冷链转运至实验室',
    desc: 'BASE 车向实验室发送接收预报。样品在 2 小时内通过恒温转运箱送达实验室，扫码入库。全程无人接触样品，完全消除人为交叉污染风险。' },
];

let stepIdx = -1;
let running = false;
let animFrame = null;

const stageBar = document.getElementById('stageBar');
const panelTitle = document.getElementById('panelTitle');
const panelDesc = document.getElementById('panelDesc');
const panelData = document.getElementById('panelData');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');
const ctrlInfo = document.getElementById('ctrlInfo');
const drone = document.getElementById('drone');
const baseCar = document.getElementById('baseCar');
const labStatus = document.getElementById('labStatus');
const spots = [0,1,2].map(i => document.getElementById('spot'+i));

// coordinates for drone path
const COORDS = {
  base: {b:55, l:10},  // bottom%, left%
  spots: [
    {b:55, l:38},
    {b:45, l:68},
    {b:65, l:82},
  ]
};

// stage bar
function renderBar(){
  stageBar.innerHTML = STAGES.map((s,i)=>{
    let cls = i < stepIdx ? 'sb-step done' : (i===stepIdx ? 'sb-step active' : 'sb-step');
    return `${i>0?'<span class="sb-arrow">➤</span>':''}<span class="${cls}" onclick="goStep(${i})"><span class="num">${s.icon}</span>${s.name}</span>`;
  }).join('');
}

function updatePanel(){
  if(stepIdx < 0 || stepIdx >= STAGES.length){
    panelTitle.textContent = '就绪';
    panelDesc.textContent = '点击"开始演示" 查看无人化采样全流程';
    panelData.innerHTML = `<div class="pd-item"><div class="pd-label">系统状态</div><div class="pd-val good">待命</div></div>
      <div class="pd-item"><div class="pd-label">样品数</div><div class="pd-val">0 / 3</div></div>`;
    return;
  }
  const s = STAGES[stepIdx];
  panelTitle.textContent = s.title;
  panelDesc.textContent = s.desc;
  const doneCount = Math.min(stepIdx, 3);
  const sampleCount = stepIdx >= 3 ? 3 : (stepIdx >= 0 ? stepIdx : 0);
  panelData.innerHTML = `
    <div class="pd-item"><div class="pd-label">阶段进度</div><div class="pd-val">${stepIdx+1} / ${STAGES.length}</div></div>
    <div class="pd-item"><div class="pd-label">已采样品</div><div class="pd-val ${sampleCount>=3?'good':'warn'}">${Math.min(sampleCount, 3)} / 3</div></div>
    <div class="pd-item"><div class="pd-label">定位精度</div><div class="pd-val good">±2cm</div></div>
    <div class="pd-item"><div class="pd-label">链路状态</div><div class="pd-val good">在线</div></div>
  `;
  ctrlInfo.textContent = `阶段 ${stepIdx+1}/${STAGES.length} · ${s.name}`;
}

function updateBtn(){
  if(stepIdx < 0){
    btnNext.textContent = '▶ 开始演示';
    btnNext.disabled = false;
  } else if(stepIdx < STAGES.length - 1){
    btnNext.textContent = '▶ 下一步';
    btnNext.disabled = false;
  } else if(stepIdx === STAGES.length - 1){
    btnNext.textContent = '✓ 流程完成';
    btnNext.disabled = true;
  }
}

function animateDrone(from, to, onDone){
  if(drone.style.opacity === '0') drone.style.opacity = '1';
  const d = 1.2;
  drone.style.transition = `all ${d}s cubic-bezier(0.34,1,0.64,1)`;
  drone.style.bottom = to.b + '%';
  drone.style.left = to.l + '%';
  setTimeout(onDone, d * 1000 + 100);
}

function setSpotState(idx, state){
  spots[idx].className = 'spot ' + state;
}

function animateSample(idx, onDone){
  // brief animation
  const s = spots[idx];
  s.style.transform = 'scale(1.15)';
  setTimeout(()=>{s.style.transform = 'scale(1)';}, 400);
  setTimeout(onDone, 500);
}

function drawTrail(){
  const svg = document.getElementById('flowTrail');
  // bounds
  const map = document.getElementById('map');
  const r = map.getBoundingClientRect();
  svg.innerHTML = '';
  // draw path from base to each spot, then back to base
  const pts = [
    {x: r.width*0.10, y: r.height*0.62},
    {x: r.width*0.38, y: r.height*0.32},
    {x: r.width*0.68, y: r.height*0.40},
    {x: r.width*0.82, y: r.height*0.27},
    {x: r.width*0.68, y: r.height*0.40},
    {x: r.width*0.38, y: r.height*0.32},
    {x: r.width*0.10, y: r.height*0.62},
  ];
  // dashed
  let d = '';
  for(let i=0; i<pts.length-1; i++){
    const a=pts[i], b=pts[i+1];
    d += `M${a.x},${a.y}L${b.x},${b.y}`;
  }
  svg.innerHTML = `<path d="${d}" stroke="rgba(0,200,255,0.08)" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>`;
}

function goStep(idx){
  stepIdx = idx;
  renderBar();
  updatePanel();
  updateBtn();

  // Animate based on stage
  const s = STAGES[idx];
  switch(s.id){
    case 'arrive':
      // base car drives in
      baseCar.style.opacity = '1';
      baseCar.style.bottom = '18%';
      baseCar.style.left = '10%';
      drone.style.opacity = '0';
      spots.forEach(sp=>sp.className='spot');
      labStatus.classList.remove('show');
      break;

    case 'launch':
      // drone appears on top of base
      drone.style.opacity = '1';
      drone.style.bottom = '30%';
      drone.style.left = '10%';
      break;

    case 'nav':
      // drone flies to spot 0
      animateDrone(
        {b:30, l:10},
        COORDS.spots[0],
        ()=>{}
      );
      break;

    case 'sample':
      // drone at spot0, sampling animation
      animateDrone(
        COORDS.spots[0],
        {b:COORDS.spots[0].b-1, l:COORDS.spots[0].l},
        ()=>{
          animateSample(0, ()=>{
            setSpotState(0, 'done');
            animateDrone(
              {b:COORDS.spots[0].b-1, l:COORDS.spots[0].l},
              COORDS.spots[1],
              ()=>{
                animateSample(1, ()=>{
                  setSpotState(1, 'done');
                  animateDrone(
                    {b:COORDS.spots[1].b, l:COORDS.spots[1].l},
                    COORDS.spots[2],
                    ()=>{
                      animateSample(2, ()=>{
                        setSpotState(2, 'done');
                      });
                    }
                  );
                });
              }
            );
          });
        }
      );
      break;

    case 'preserv':
      // all spots done, slight hover
      animateDrone(
        COORDS.spots[2],
        {b:COORDS.spots[2].b-1, l:COORDS.spots[2].l},
        ()=>{}
      );
      break;

    case 'return':
      // drone returns to base
      animateDrone(
        COORDS.spots[2],
        {b:30, l:10},
        ()=>{}
      );
      break;

    case 'lab':
      // show lab chain
      drone.style.opacity = '0';
      labStatus.classList.add('show');
      animateDrone(
        {b:30, l:10},
        {b:20, l:6},
        ()=>{drone.style.opacity='0'}
      );
      break;
  }
}

function nextStep(){
  if(stepIdx < 0){
    resetSim();
  }
  stepIdx++;
  if(stepIdx >= STAGES.length){
    stepIdx = STAGES.length - 1;
    return;
  }
  goStep(stepIdx);
}

function resetSim(){
  stepIdx = -1;
  baseCar.style.bottom = '18%';
  baseCar.style.left = '10%';
  drone.style.opacity = '0';
  drone.style.bottom = '18%';
  drone.style.left = '13%';
  spots.forEach(sp=>sp.className='spot');
  labStatus.classList.remove('show');
  renderBar();
  updatePanel();
  updateBtn();
  ctrlInfo.textContent = '7 阶段流程 · 点击运行模拟';
  btnNext.textContent = '▶ 开始演示';
  btnNext.disabled = false;
}

// init
drawTrail();
resetSim();
</script>
