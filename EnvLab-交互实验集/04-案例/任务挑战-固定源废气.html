  caseIntro:"某园区废气治理设施正在进行教学演示。你需要完成一次固定源废气监测任务，判断什么时候可以测、数据是否可用、异常时该先查什么。",

  steps:[
    {id:"air-intake",short:"任务受理",title:"先确认要回答的问题",skill:"任务边界",intro:"委托信息只写了“检查废气治理效果”，但没有把对象、污染物和工况要求拆开。",evidence:[["任务对象","某生产线排气筒与末端治理设施（教学案例）"],["已有信息","监测时段、污染物项目和生产负荷尚未核对"],["当前风险","测到了数字，却无法说明数字对应哪种工况"]],question:"出发前最应该先完成什么？",options:[{text:"核对排气筒、生产线、治理设施状态、目标污染物、采样时段和适用方法，再形成任务方案。",correct:true,feedback:"先定义对象和问题，才能确定测什么、何时测、怎样记录以及结果如何解释。",impact:"这一步建立了排放数据的上下文。"},{text:"先到现场找一根最方便接近的烟道，到了再决定测什么。",correct:false,feedback:"便利的烟道不一定对应委托对象，临时决定项目也可能导致采样器材和方法不匹配。",impact:"错误能力点：任务边界。"},{text:"只确认治理设施出口浓度，生产负荷和设施运行状态可以不记。",correct:false,feedback:"没有工况和治理状态，出口数字缺少解释条件，也无法判断是否具有代表性。",impact:"错误能力点：任务边界。"}]},
    {id:"air-condition",short:"工况确认",title:"把“正在生产”确认成可解释的工况",skill:"工况确认",intro:"到达现场后，生产线可以运行，但负荷和治理设施状态正在变化。",evidence:[["现场变化","风机频率刚调整，治理设施压差仍在波动"],["需要记录","生产负荷、原料或燃料状态、治理设施运行参数"],["教学目标","测量时段应与任务方案中的工况相匹配"]],question:"哪种处理更稳妥？",options:[{text:"先等待并确认工况稳定，记录生产和治理设施状态，再进入正式测量。",correct:true,feedback:"工况稳定不是一句口头描述，而是需要结合生产和治理设施记录来确认。",impact:"结果只有在清楚的工况下才具备比较价值。"},{text:"只要烟囱有烟，就立刻开始采样，波动可以用平均值处理。",correct:false,feedback:"烟气存在不等于工况满足要求；波动可能使采样时段无法代表任务对象。",impact:"错误能力点：工况确认。"},{text:"先把采样时间凑够，生产负荷变化留到报告里再解释。",correct:false,feedback:"事后解释不能自动修复工况变化对样品代表性的影响，应先判断是否需要调整或重测。",impact:"错误能力点：工况确认。"}]},
    {id:"air-point",short:"测点判断",title:"让采样点真正代表这股烟气",skill:"测点代表性",intro:"烟道上有多个可用接口，附近还有弯头、变径和汇流段。",evidence:[["现场条件","不同接口到扰动部件的距离不同"],["方案要求","选择符合适用方法和现场条件的代表性截面"],["记录内容","测点位置、烟道状态和无法满足条件的限制都要留痕"]],question:"选择采样截面时应优先遵循什么？",options:[{text:"按适用方法和任务方案选择代表性截面；若现场受限，记录限制并评估是否需要替代方案。",correct:true,feedback:"测点选择需要同时满足方法要求和现场可解释性，不能只看接口是否方便。",impact:"测点限制应成为报告中的证据，而不是被隐藏。"},{text:"选择离治理设施最近的接口，越近越能代表治理效果。",correct:false,feedback:"离设备近不等于截面条件合适，扰动和流场状态仍需要按方法判断。",impact:"错误能力点：测点代表性。"},{text:"选择烟气温度最低的位置，安全和操作都更容易。",correct:false,feedback:"安全要求要满足，但不能以牺牲测点代表性为代价；必要时应调整方案并记录。",impact:"错误能力点：测点代表性。"}]},

    {id:"air-anomaly",short:"异常诊断",title:"工况变化时先暂停，不要硬凑一组数据",skill:"异常诊断",intro:"正式测量中，治理设施压差突然变化，烟气流量也出现明显波动。",evidence:[["异常现象","流量曲线波动，治理设施运行参数发生变化"],["已有记录","变化发生在样品采集时段内"],["当前问题","样品是否仍代表任务设定工况尚未确认"]],question:"下一步最合理的处理是什么？",options:[{text:"暂停或标记受影响时段，记录异常并回查工况、采样系统和参数；必要时重新确认方案后复测。",correct:true,feedback:"先保护异常证据，再判断哪些数据受影响，不能让一组不稳定数据自动进入结论。",impact:"异常处理应留下时间、现象、判断和处置记录。"},{text:"把波动最大的几个读数删掉，让曲线看起来平滑。",correct:false,feedback:"删数据会破坏原始记录，也不能证明剩余读数代表了稳定工况。",impact:"错误能力点：异常诊断。"},{text:"继续采样直到时长满足要求，工况变化在备注里一句带过。",correct:false,feedback:"满足时长不等于满足代表性；异常可能已经改变样品和结果的解释范围。",impact:"错误能力点：异常诊断。"}]},
    {id:"air-conclusion",short:"结论表达",title:"把浓度、流量和治理效果分开表达",skill:"结论表达",intro:"监测数据和现场记录已经整理。现在要形成一个不夸大、可复核的任务结论。",evidence:[["已有数据","污染物浓度、烟气参数、工况记录和异常处置"],["仍需核对","适用标准、排放许可要求、统计口径和数据限制"],["教学边界","本任务不直接给出任何正式限值结论"]],question:"哪种报告表达最稳妥？",options:[{text:"分别说明测量工况、浓度与排放量口径、治理设施状态、质量控制和限制，再引用适用文件作比对。",correct:true,feedback:"结果的含义取决于对象、工况、计算口径和质量状态；这些信息应一起呈现。",impact:"任务完成：你没有把一个数字过度解释成所有结论。"},{text:"只看出口浓度是否变低，就直接判定治理设施达标。",correct:false,feedback:"治理效果、排放限值和工况代表性是不同问题，不能用一个数字替代全部判断。",impact:"错误能力点：结论表达。"},{text:"只报告最好的一个采样时段，其他时段作为现场噪声不写。",correct:false,feedback:"选择性报告会掩盖工况和异常信息，不能作为完整监测结论。",impact:"错误能力点：结论表达。"}]}
  ],
