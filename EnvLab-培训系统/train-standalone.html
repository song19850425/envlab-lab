<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪器操作培训 | EnvLab</title>
<style>
  :root{ --accent:#f59e0b; --bg:#0b1020; --panel:#121a30; --line:#22304f; --txt:#e8eefc; --mut:#8aa0c6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
  header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
  .badge{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:2px 12px;margin-bottom:10px}
  h1{margin:0;font-size:26px}
  .hero-sub{color:var(--mut);font-size:13px;margin-top:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  input{width:100%;background:#0c1428;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{display:inline-block;background:var(--accent);color:#0b1020;border:none;border-radius:8px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .step-no{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.5px}
  .q{font-size:18px;margin:8px 0 18px;font-weight:600}
  .opt{display:block;width:100%;text-align:left;background:#0c1428;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:13px 16px;margin-bottom:10px;font-size:15px;cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}
  .opt.wrong{border-color:#ef4444;background:rgba(239,68,68,.12)}
  .opt.dim{opacity:.45;pointer-events:none}
  .feedback{margin-top:6px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
  .feedback.info{display:block;background:rgba(138,160,198,.12);border-left:3px solid var(--mut)}
  .feedback.fatal{display:block;background:rgba(239,68,68,.14);border-left:3px solid #ef4444;color:#ffd9d9}
  .progress{height:6px;background:#0c1428;border-radius:6px;overflow:hidden;margin:6px 0 18px}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);transition:.3s}
  .log{font-size:12.5px;color:var(--mut);max-height:180px;overflow:auto;border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
  .log div{margin:3px 0}
  .ok{color:#22c55e}.bad{color:#ef4444}.warn{color:#f59e0b}
  .result{text-align:center;padding:30px 10px}
  .score{font-size:54px;font-weight:800;color:var(--accent)}
  .pass{color:#22c55e;font-size:20px;font-weight:700;margin:6px 0}
  .fail{color:#ef4444;font-size:20px;font-weight:700;margin:6px 0}
  .picker a{display:block;background:#0c1428;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--txt)}
  .picker a:hover{border-color:var(--accent)}
  .picker small{color:var(--mut)}
  footer{color:var(--mut);font-size:12px;text-align:center;margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
  .note{font-size:12px;color:var(--mut);background:rgba(138,160,198,.08);border-radius:8px;padding:8px 12px;margin:10px 0}
  /* 操作规程学习区 */
  .op .op-sec{background:#0c1428;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px}
  .op .op-sec h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
  .op ul{margin:0;padding-left:20px}
  .op li{margin:3px 0;font-size:14px}
  .redline{margin-top:8px;background:rgba(239,68,68,.12);border-left:3px solid #ef4444;border-radius:6px;padding:8px 12px;font-size:13px;color:#ffd9d9}
  .redline b{color:#ff8a8a}
  /* 操作规程完整交互页嵌入 */
  .op-embed{margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .op-embed-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:#0c1428;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
  .op-frame{width:100%;height:68vh;border:0;display:block}
  .op-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  /* ===== 移动端适配 ===== */
  @media (max-width:680px){
    .wrap{padding:16px 14px 48px}
    header{padding-bottom:12px;margin-bottom:16px}
    h1{font-size:22px}
    .card{padding:16px}
    h2{font-size:18px!important}
    .q{font-size:17px}
    .opt{font-size:16px;padding:15px 16px}
    input{font-size:16px}              /* ≥16px 防 iOS 聚焦自动缩放 */
    .btn{width:100%;text-align:center;padding:14px 18px;font-size:16px;margin-top:14px}
    .btn.ghost{width:auto;margin-top:14px}
    .op-actions{margin-bottom:12px}
    .op-actions .btn.ghost{flex:1;text-align:center;margin-top:0}
    .op-frame{height:64vh;min-height:380px}
    .score{font-size:46px}
    .result{padding:24px 6px}
    .picker a{padding:15px 16px}
    .note,.hero-sub{font-size:12.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">EnvLab 仪器操作培训</span>

ype": "choice", "q": "关机时，熄火与关气体的正确顺序是？", "options": [{"text": "先熄灭火焰（关乙炔），再关空气", "correct": true}, {"text": "先关空气（助燃气），再关乙炔", "fatal": true}, {"text": "直接切断主机电源", "wrong": true}], "explain": "关机必须『先熄火（断燃气）、后断助燃气』。若先断空气，火焰因缺氧回缩至喷嘴内燃烧（回火），烧损雾化器甚至引发危险。与开机顺序对称。"}, {"id": "s6", "type": "choice", "q": "火焰完全熄灭后，还应做什么？", "options": [{"text": "先关乙炔总阀，确认无泄漏后再关空气总阀，最后关主机", "correct": true}, {"text": "立刻拔掉电源插头", "wrong": true}, {"text": "不用管，下次直接用", "wrong": true}], "explain": "熄火后须依次关闭燃气总阀、助燃气总阀，确认无泄漏再关主机电源，并作好使用记录。遗留带压燃气是重大安全隐患。"}]}, "uv-vis-l5s": {"id": "uv-vis-l5s", "name": "紫外可见分光光度计", "model": "L5S（示例机型）", "category": "紫外-可见分光（比色）", "accent": "#0ea5e9", "opPage": "operation-pages/L5S紫外可见分光光度计-交互版.html", "remark": "依据受控操作规程构建（已脱敏），仅作上岗前交互培训，不替代现场监督与能力确认。", "passThreshold": 80, "op": [{"title": "一、开机与波长选择", "points": ["开盖状态下按 A/T/C/F 选择透光率（T%）测量模式", "设定本次测定所需波长，开机预热 ≥30 min"], "redLines": ["严禁未预热即测量——光源与光电管未稳定，基线漂移、读数全乱"]}, {"title": "二、调零与调满", "points": ["关盖（光路通样品）调 100%T（调满）", "开盖（光路被挡）调 0%T（调零）"], "redLines": ["禁止跳过调零/调满直接测定——零点与满度未建立，后续吸光度全部失真"]}, {"title": "三、装样", "points": ["比色皿装液约 3/4，手握毛面、透光面（光面）对准光路", "外壁用擦镜纸擦干，同方向放入比色室"], "redLines": ["禁止拿毛面当光面朝向光路、外壁留水渍、液面低于 2/3——散射与折射误差剧增"]}, {"title": "四、测定顺序", "points": ["按 空白 → 标准曲线 → 样品 顺序测定", "同一批次使用配对比色皿，同方向放入"], "redLines": ["禁止不同比色皿随意混用而不配对——皿间透差直接带入系统误差"]}, {"title": "五、关机与清洗", "points": ["测完用乙醇或蒸馏水溶液清洗比色皿，倒扣晾干", "退出软件、关闭主机电源"], "redLines": ["禁止测完不清洗——残留样品腐蚀比色皿、交叉污染下一批"]}], "steps": [{"id": "s1", "type": "choice", "q": "开机后第一步应当做什么？", "options": [{"text": "选定测定波长，开机预热 ≥30 min", "correct": true}, {"text": "直接放样品开始测量", "fatal": true}, {"text": "先关机再重启一次", "wrong": true}], "explain": "光源与光电管需预热稳定，未预热即测会导致基线漂移、读数失真。这是比色分析的头号红线。"}, {"id": "s2", "type": "choice", "q": "测定前调零与调满的正确操作是？", "options": [{"text": "开盖调 0%T，关盖调 100%T", "correct": true}, {"text": "关盖调 0%T，开盖调 100%T", "wrong": true}, {"text": "不用调，直接读", "fatal": true}], "explain": "开盖时光路被挡为 0%T，关盖通光为 100%T。顺序颠倒或省略，吸光度全部失真。"}, {"id": "s3", "type": "choice", "q": "装比色皿时，正确的手持与放置方式是？", "options": [{"text": "手握毛面、光面朝光路、外壁擦干、液面约 3/4", "correct": true}, {"text": "握住光面、外壁有水也直接放", "wrong": true}, {"text": "随便拿，反正都能测", "fatal": true}], "explain": "光面朝向光路、外壁擦干是保证透光准确的前提；毛面当光面或留水渍会造成散射误差。"}, {"id": "s4", "type": "choice", "q": "样品测定应按什么顺序进行？", "options": [{"text": "空白 → 标准曲线 → 样品", "correct": true}, {"text": "直接测样品省时间", "wrong": true}, {"text": "先样品后标准曲线", "wrong": true}], "explain": "先空白校零、再建标准曲线，方可测样品。跳过校准直接测样品，数据无溯源、评审必判不符合。"}, {"id": "s5", "type": "choice", "q": "测定结束后，比色皿应如何处理？", "options": [{"text": "用乙醇/蒸馏水清洗、倒扣晾干", "correct": true}, {"text": "直接收起，下次再用", "fatal": true}, {"text": "用卫生纸胡乱擦干", "wrong": true}], "explain": "残留样品会腐蚀比色皿并交叉污染；不清洗直接存放是常见陋习，长期导致数据异常。"}]}, "balance-ms105du": {"id": "balance-ms105du", "name": "十万分之一天平", "model": "MS105DU（示例机型）", "category": "精密称量", "accent": "#14b8a6", "opPage": "operation-pages/MS105DU十万分之一天平-交互版.html", "remark": "依据受控操作规程构建（已脱敏），仅作上岗前交互培训，不替代现场监督与能力确认。", "passThreshold": 80, "op": [{"title": "一、水平调节", "points": ["调节底脚使水平泡居于中央", "记不住调平口诀时反复微调至居中即可"], "redLines": ["严禁水平未调就称量——读数持续漂移、刀口长期偏载受损"]}, {"title": "二、通电预热", "points": ["开机自检（显示 OFF 后按 ON 启动）", "校准需通电 ≥60 min；日常高精度称量也需充分预热"], "redLines": ["禁止通电不足即称量/校准——尤其是十万分之一级，温漂使数据严重失准"]}, {"title": "三、校准", "points": ["进入校准程序，按提示放置对应量程的标准砝码", "稳定后确认校准通过"], "redLines": ["禁止不放砝码就按校准、或放错量程砝码——会得到虚假校准值"]}, {"title": "四、称量", "points": ["待稳定指示（如『0』图标消失）显示稳定值后读数", "合理使用去皮（Tare）"], "redLines": ["禁止在数值跳动未稳定时读数——瞬时值无代表意义"]}, {"title": "五、关机与维护", "points": ["按住 OFF 关机", "十万分之一级建议 24 h 通电保温（高精度恒温）"], "redLines": ["禁止频繁开关机/直接断电——温度骤变引入漂移，缩短刀口寿命"]}], "steps": [{"id": "s1", "type": "choice", "q": "称量前首先要做什么？", "options": [{"text": "调节底脚使水平泡居中", "correct": true}, {"text": "直接放上样品称量", "fatal": true}, {"text": "只调一边底脚", "wrong": true}], "explain": "水平未调，读数持续漂移且刀口长期偏载受损。这是天平使用的头号红线。"}, {"id": "s2", "type": "choice", "q": "执行校准前，仪器应处于什么状态？", "options": [{"text": "已通电预热 ≥60 min 且水平调好", "correct": true}, {"text": "刚开机通电 5 min 就校准", "fatal": true}, {"text": "不预热、不校准直接称", "wrong": true}], "explain": "十万分之一天平对温度极敏感，通电不足即校准会得到虚假校准值，后续称量全部失准。"}, {"id": "s3", "type": "choice", "q": "进入校准程序后，正确的操作是？", "options": [{"text": "按提示放置对应量程的标准砝码，稳定后确认", "correct": true}, {"text": "空盘直接按校准确认", "fatal": true}, {"text": "随手放个差不多重的重物", "wrong": true}], "explain": "校准必须放置正确的标准砝码；空盘或错砝码校准会产生虚假系数，数据不可信。"}, {"id": "s4", "type": "choice", "q": "何时可以读取称量值？", "options": [{"text": "稳定指示消失、显示稳定值后读", "correct": true}, {"text": "数字一显示就立刻读", "wrong": true}, {"text": "数值还在跳动时按打印", "fatal": true}], "explain": "未稳定读数取的是瞬时跳动值，无代表意义。须待稳定指示消失。"}, {"id": "s5", "type": "choice", "q": "关机与日常维护的正确做法是？", "options": [{"text": "按住 OFF 关机；高精度级建议 24 h 通电保温", "correct": true}, {"text": "直接拔掉电源插头", "fatal": true}, {"text": "每天用完就断电关机", "wrong": true}], "explain": "直接断电/频繁开关会引入温漂、缩短刀口寿命；十万分之一级恒温保温有利于长期稳定。"}]}, "sampler-qcs6000": {"id": "sampler-qcs6000", "name": "四气路大气采样器", "model": "QCS6000（示例机型）", "category": "现场采样", "accent": "#10b981", "opPage": "operation-pages/QCS6000四气路大气采样器-交互版.html", "remark": "依据受控操作规程构建（已脱敏），仅作上岗前交互培训，不替代现场监督与能力确认。", "passThreshold": 80, "op": [{"title": "一、含尘预处理", "points": ["采集含尘气体前先装好滤膜或吸收液", "检查气路连接与干燥保护装置"], "redLines": ["严禁不装滤膜直接抽含尘气体——粉尘进入泵体造成堵塞、污染、流量失准"]}, {"title": "二、参数设置", "points": ["设置采样时间 → 确认 → 开始采集", "核对流量与采样介质匹配"], "redLines": ["禁止将采样时间设为 0 或负值——无效采样且可能触发异常"]}, {"title": "三、采集控制", "points": ["取消键 = 暂停/继续；连续按两次 = 重新计时", "采样中保持采样头直立、避免剧烈晃动"], "redLines": ["禁止误操作取消键导致计时意外归零、整段样品报废"]}, {"title": "四、关机", "points": ["采样结束先关背面总开关，再长按取消/电源键", "充电约 12 h 备下次使用"], "redLines": ["禁止只按电源键不关背面总开关、或带电插拔管路——电路与电池隐患"]}, {"title": "五、维护", "points": ["定期检查管路、干燥剂、滤膜夹", "防止吸收液倒吸进入泵体"], "redLines": ["禁止让吸收液倒吸进泵——腐蚀气路、损坏流量传感器"]}], "steps": [{"id": "s1", "type": "choice", "q": "采集含尘气体前，必须首先做什么？", "options": [{"text": "先装好滤膜/吸收液再开机抽气", "correct": true}, {"text": "不装滤膜直接开机抽含尘气", "fatal": true}, {"text": "装反滤膜方向", "wrong": true}], "explain": "含尘气体不装滤膜直接抽，粉尘进入泵体造成堵塞污染、流量失准。这是现场采样的致命红线。"}, {"id": "s2", "type": "choice", "q": "开始采集前如何设置参数？", "options": [{"text": "设置采 ", "wrong": true}], "explain": "UV 仅限无人时开启，伤害眼肤；操作必须开鼓风机建立层流屏障。顺序错即失去防护意义。"}, {"id": "s2", "type": "choice", "q": "工作时拉门应置于什么位置？", "options": [{"text": "升至标示的 8 英寸工作口高度", "correct": true}, {"text": "完全拉到顶（全开）", "fatal": true}, {"text": "关着门伸手进去操作", "wrong": true}], "explain": "拉门过高破坏前屏障、过低挡住气流，均使生物安全防护失效，属致命错误。"}, {"id": "s3", "type": "choice", "q": "摆放物品时应当注意？", "options": [{"text": "留出前后气流通道，不堵格栅，手臂缓慢进出", "correct": true}, {"text": "物品堆满挡住前格栅", "wrong": true}, {"text": "快速大幅挥动手臂", "wrong": true}], "explain": "堵塞格栅会造成气流短路，屏障失效，样品与人员双向污染。保持通道是关键。"}, {"id": "s4", "type": "choice", "q": "操作结束后的处理应为？", "options": [{"text": "拉下门 → 关鼓风机 → 开 UV 30 min → 关 UV", "correct": true}, {"text": "不做终末消毒直接离开", "wrong": true}, {"text": "开 UV 但人还在柜前", "fatal": true}], "explain": "终末 UV 消毒是防止交叉污染的必要步骤；但 UV 开启时人不得停留柜前。"}, {"id": "s5", "type": "choice", "q": "柜内使用火源和应对警铃，正确的是？", "options": [{"text": "禁用明火；警铃响立即暂停排查", "correct": true}, {"text": "用酒精灯明火加热更方便", "fatal": true}, {"text": "警铃响继续手头操作", "wrong": true}], "explain": "明火破坏层流且易燃；警铃是安全预警，必须停手排查，强行操作可能扩大事故。"}]}, "incubator-spx250": {"id": "incubator-spx250", "name": "生化培养箱", "model": "SPX-250B-Z（示例机型）", "category": "微生物培养", "accent": "#06b6d4", "opPage": "operation-pages/SPX-250B-Z生化培养箱-交互版.html", "remark": "依据受控操作规程构建（已脱敏），仅作上岗前交互培训，不替代现场监督与能力确认。", "passThreshold": 80, "op": [{"title": "一、放置与接地", "points": ["落地垫平、有效接地、远离强电磁干扰源", "搬运时倾斜角不得大于 45°"], "redLines": ["严禁不接地使用——漏电风险", "严禁倒置或 >45° 倾斜搬运——压缩机润滑油倒流损坏"]}, {"title": "二、开机与模式", "points": ["接通电源开机", "若设定温度高于环境 5℃ 选 RT+5，低于则选『自动』"], "redLines": ["禁止模式选错——RT+5 与自动误用会导致控温失效或无法制冷"]}, {"title": "三、设定温度", "points": ["按 SET 进入设定，调整目标温度（如 37℃）并确认", "观察实际温度趋近设定值"], "redLines": ["禁止设定超出设备量程的温度——触发保护或失控"]}, {"title": "四、放入物品", "points": ["待箱内升温并恒温后再放入物品", "物品之间留空隙、关好内外门"], "redLines": ["禁止物品挤满不留空隙——箱内温度不均", "禁止未恒温就批量放入——温度冲击"]}, {"title": "五、运行维护", "points": ["运行中尽量少开门", "定期除霜、校验温度、清洁内胆"], "redLines": ["禁止频繁开门——温度剧烈波动影响培养", "禁止搬运时倒置"]}], "steps": [{"id": "s1", "type": "choice", "q": "安装放置培养箱时 const INLINE_INDEX = [{"id": "aas-900t", "name": "原子吸收分光光度计", "model": "AAS-900T（示例机型）", "category": "光谱分析"}, {"id": "uv-vis-l5s", "name": "紫外可见分光光度计", "model": "L5S（示例机型）", "category": "紫外-可见分光（比色）"}, {"id": "balance-ms105du", "name": "十万分之一天平", "model": "MS105DU（示例机型）", "category": "精密称量"}, {"id": "sampler-qcs6000", "name": "四气路大气采样器", "model": "QCS6000（示例机型）", "category": "现场采样"}, {"id": "biosafety-bsc1300", "name": "生物安全柜", "model": "BSC-1300IIA2（示例机型）", "category": "生物安全"}, {"id": "incubator-spx250", "name": "生化培养箱", "model": "SPX-250B-Z（示例机型）", "category": "微生物培养"}];
const LS_KEY = "envlab_training_records";
const LS_PROFILES = "envlab_profiles";
const LS_CURRENT = "envlab_current";
function getProfiles(){ try{ return JSON.parse(localStorage.getItem(LS_PROFILES)||"[]"); }catch(e){ return []; } }
function getCurrent(){ try{ return JSON.parse(localStorage.getItem(LS_CURRENT)||"null"); }catch(e){ return null; } }
function setCurrent(p){ try{ localStorage.setItem(LS_CURRENT, JSON.stringify(p)); }catch(e){} }
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const instId = params.get("inst");

let INST = null;
let trainee = null;
let stepIndex = 0;
let logLines = [];
let startTime = 0;
let stepState = [];

function buildOp(){
  if(!INST.op || !INST.op.length) return "";
  return INST.op.map(s=>`
    <div class="op-sec">
      <h3>${s.title}</h3>
      <ul>${s.points.map(p=>`<li>${p}</li>`).join("")}</ul>
      ${(s.redLines&&s.redLines.length)?`<div class="redline"><b>⚠ 红线：</b>${s.redLines.map(r=>`<div>• ${r}</div>`).join("")}</div>`:""}
    </div>`).join("");
}

function loadInst(id){
  const j = INLINE_DB[id];
  if(!j){ $("#app").innerHTML = '<div class="card">未找到该仪器配置（'+id+'）</div>'; return; }
  INST=j; stepState = j.steps.map(()=>({attemptsWrong:0,fatalHit:false}));
  document.documentElement.style.setProperty('--accent', j.accent||'#f59e0b');
  boot();
}

function boot(){
  $("#title").textContent = INST.name;
  $("#heroSub").textContent = "示例机型：" + INST.model + " · " + (INST.remark||"");
  renderOp();   // 先学操作规程}

function renderOp(){
  const embed = INST.opPage ? `
    <div class="op-embed">
      <div class="op-embed-bar">
        <span>📟 完整交互培训（已做好的对应操作规程仿真，可点开实操演练）</span>
        <a class="btn ghost" href="${INST.opPage}" target="_blank" rel="noopener" style="margin:0">↗ 新标签打开</a>
      </div>
      <iframe class="op-frame" src="${INST.opPage}" title="操作规程完整交互培训"></iframe>
    </div>` : "";
  $("#app").innerHTML = `
    <div class="card">
      <div class="step-no">培训前 · 第一步：学习操作规程</div>
      <h2 style="margin:6px 0 4px;font-size:20px">${INST.name} 标准操作规程（要点）</h2>
      <div class="note">请先在上方「完整交互培训」中通读并演练标准操作；下方为要点速记，供快速对照。确认理解后再进入作答；作答途中也可随时「查看操作规程」。</div>
      ${embed}
      <h3 style="margin:18px 0 6px;font-size:15px;color:var(--accent)">要点速记</h3>
      <div class="op">${buildOp()}</div>
      <button class="btn" id="toForm">我已学习，开始作答 →</button>
    </div>`;
  $("#toForm").addEventListener("click", renderForm);
}

function renderForm(){
  const cur = getCurrent();
  const curName = cur ? cur.name : "";
  const curEmp  = cur ? (cur.emp||"") : "";
  const curLab  = cur ? (cur.lab||"演示实验室") : "演示实验室";
  $("#app").innerHTML = `
    <div class="card">
      <div class="step-no">培训前 · 第二步：培训登记</div>
      <h2 style="margin:6px 0 4px;font-size:20px">确认学员信息后开始</h2>
      ${cur?`<div class="note" style="border-left:3px solid var(--accent);background:rgba(138,160,198,.1)">当前登录学员：<b style="color:var(--txt)">${cur.name}</b>${cur.emp?`（${cur.emp}）`:''} · ${cur.lab}${cur.phone?` · ${cur.phone}`:''}　<a class="btn ghost" href="index.html?logout=1" style="margin:0;padding:4px 10px;font-size:12px">切换 / 注销</a></div>`:`<div class="note">未检测到登录信息，也可直接填写后开始（记录仅存本机）。建议从主页登记后再进入，便于集中留痕。</div>`}
      <label>姓名 / 工号称呼 *</label>
      <input id="tName" value="${curName}" placeholder="如：张某某 / 03号操作员">
      <label>工号（选填）</label>
      <input id="tEmp" value="${curEmp}" placeholder="如：CJ-0213">
      <label>所属实验室 / 部门（选填）</label>
      <input id="tLab" value="${curLab}" placeholder="如：某省环境检测一室">
      <div style="margin-top:14px"><button class="btn ghost" id="backOp">← 重看操作规程</button></div>
      <button class="btn" id="startBtn" ${cur?'':'disabled'}>开始作答</button>
      <div class="note">记录仅保存在本机浏览器（localStorage），用于生成培训佐证。管理员可在 admin.html 查看汇总。</div>
    </div>`;
  $("#backOp").addEventListener("click", renderOp);
  $("#tName").addEventListener("input", e=>{ $("#startBtn").disabled = !e.target.value.trim(); });
  $("#startBtn").addEventListener("click", ()=>{
    trainee = { name:$("#tName").value.trim(), emp:$("#tEmp").value.trim(), lab:$("#tLab").value.trim()||"演示实验室" };
    startTime = Date.now();
    stepIndex = 0; logLines = [];
    renderStep();
  });
}

function renderStep(){
  const s = INST.steps[stepIndex];
  const total = INST.steps.length;
  const pct = Math.round(stepIndex/total*100);
  $("#app").innerHTML = `
    <div class="card">
      <div class="op-actions">
        <button class="btn ghost" id="opToggle">📖 查看要点</button>
        ${INST.opPage?`<a class="btn ghost" href="${INST.opPage}" target="_blank" rel="noopener" style="margin:0">↗ 打开完整交互培训</a>`:""}
      </div>
      <div id="opPanel" style="display:none;margin-bottom:14px">${buildOp()}</div>
      <div class="step-no">第 ${stepIndex+1} / ${total} 步</div>
      <div class="q">${s.q}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div id="opts"></div>
      <div class="feedback" id="fb"></div>
      <div class="log" id="log">${logLines.join("")}</div>
    </div>`;
  $("#opToggle").addEventListener("click", ()=>{
    const p = $("#opPanel");
    p.style.display = p.style.display==="none" ? "block" : "none";
    $("#opToggle").textContent = p.style.display==="none" ? "📖 查看要点" : "📖 收起要点";
  });
  const box = $("#opts");
  s.options.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className="opt"; b.textContent=o.text; b.dataset.i=i;
    b.addEventListener("click", ()=>choose(o,b));
    box.appendChild(b);
  });
}

function choose(o, btn){
  const s = INST.steps[stepIndex];
  const st = stepState[stepIndex];
  const fb = $("#fb");
  if(o.fatal){
    st.fatalHit = true;
    logLines.push(`<div class="bad">✕ 第${stepIndex+1}步 触发致命红线：${o.text}</div>`);
    fb.className="feedback fatal";
    fb.textContent = "⚠ 红线警告：" + s.explain;
    btn.classList.add("wrong");
    $("#log").innerHTML = logLines.join("");
    return;
  }
  if(o.correct){
    let credit;
    if(st.fatalHit) credit = 0;
    else if(st.attemptsWrong===0) credit = 1;
    else credit = 0.5;
    btn.classList.add("correct");
    [...$("#opts").children].forEach(c=>c.classList.add("dim"));
    logLines.push(`<div class="${st.fatalHit?'warn':'ok'}">${st.fatalHit?'⚠':'✓'} 第${stepIndex+1}步 正确${st.fatalHit?'（曾触发红线，本步记0分）':''}</div>`);
    fb.className="feedback info"; fb.textContent = s.explain;
    stepState[stepIndex].credit = credit;
    $("#log").innerHTML = logLines.join("");
    setTimeout(advance, 650);
    return;
  }
  st.attemptsWrong++;
  btn.classList.add("wrong");
  fb.className="feedback info";
  fb.textContent = "这一步不对，注意：" + s.explain;
  $("#log").innerHTML = logLines.join("");
}

function advance(){
  stepIndex++;
  if(stepIndex >= INST.steps.length){ finish(); return; }
  renderStep();
}

function finish(){
  const dur = Math.round((Date.now()-startTime)/1000);
  const credits = stepState.map(st=> st.credit!==undefined?st.credit:(st.fatalHit?0:0));
  const score = Math.round(credits.reduce((a,b)=>a+b,0)/credits.length*100);
  const fatalHits = stepState.filter(st=>st.fatalHit).length;
  const passed = (fatalHits===0 && score >= (INST.passThreshold||80));
  const rec = {
    id: "TR"+Date.now(),
    ts: new Date().toISOString(),
    trainee: trainee.name, emp: trainee.emp, lab: trainee.lab,
    instrumentId: INST.id, instrumentName: INST.name, model: INST.model,
    durationSec: dur, score, fatalHits, passed,
    steps: INST.steps.map((s,i)=>({q:s.q, correct: stepState[i].credit===1, partial: stepState[i].credit===0.5, fatal: stepState[i].fatalHit}))
  };
  saveRecord(rec);
  renderResult(rec);
}

function saveRecord(rec){
  try{
    const all = JSON.parse(localStorage.getItem(LS_KEY)||"[]");
    all.push(rec);
    localStorage.setItem(LS_KEY, JSON.stringify(all));
  }catch(e){ console.warn("记录保存失败", e); }
}

function renderResult(rec){
  const cls = rec.passed ? "pass" : "fail";
  const txt = rec.passed ? "✓ 培训通过" : (rec.fatalHits>0 ? "✕ 未通过（触发致命红线，需重新培训）" : "✕ 未通过（得分未达阈值）");
  $("#app").innerHTML = `
    <div class="card result">
      <div class="step-no">培训结果</div>
      <div class="score">${rec.score}</div>
      <div class="${cls}">${txt}</div>
      <div class="hero-sub">学员：${rec.trainee} · ${rec.lab} · 用时 ${rec.durationSec}s · 致命红线 ${rec.fatalHits} 次</div>
      <div style="margin-top:18px">
        <button class="btn" id="certBtn">导出培训证明</button>
        <a class="btn ghost" href="admin.html" style="text-decoration:none">查看记录台</a>
      </div>
      <div class="note">本记录已存入本机浏览器。换设备或清缓存会丢失，重要佐证请点「导出培训证明」留存。</div>
    </div>`;
  $("#certBtn").addEventListener("click", ()=>exportCert(rec));
}

function exportCert(rec){
  const w = window.open("", "_blank");
  const rows = rec.steps.map((s,i)=>`<tr><td>${i+1}</td><td>${s.q}</td><td>${s.fatal?'<span style="color:#ef4444">触发红线</span>':s.correct?'<span style="color:#16a34a">正确</span>':(s.partial?'<span style="color:#f59e0b">纠正后正确</span>':'—')}</td></tr>`).join("");
  w.document.write(`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>培训证明</title>
  <style>body{font-family:"Microsoft YaHei",sans-serif;padding:40px;color:#1a2238;max-width:720px;margin:auto}
  h1{color:#b45309;border-bottom:2px solid #b45309;padding-bottom:10px}
  .meta{display:flex;flex-wrap:wrap;gap:18px;margin:18px 0;font-size:14px}
  .big{font-size:40px;font-weight:800;color:${rec.passed?'#16a34a':'#dc2626'}}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
  td,th{border:1px solid #cbd5e1;padding:8px;text-align:left;vertical-align:top}
  th{background:#f1f5f9}.stamp{margin-top:24px;font-size:12px;color:#7c8ba1}
  @media print{body{padding:0}}
/* a11y: 键盘焦点可见 + 减动效偏好 */
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #fbbf24;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body>
  <h1>EnvLab 仪器操作培训 · 完成证明</h1>
  <div class="meta">
    <div><b>学员：</b>${rec.trainee}</div>
    <div><b>工号：</b>${rec.emp||'—'}</div>
    <div><b>部门：</b>${rec.lab}</div>
  </div>
  <div class="meta">
    <div><b>仪器：</b>${rec.instrumentName}（${rec.model}）</div>
    <div><b>时间：</b>${new Date(rec.ts).toLocaleString('zh-CN')}</div>
    <div><b>用时：</b>${rec.durationSec}s</div>
  </div>
  <div class="big">综合得分 ${rec.score} · ${rec.passed?'通过':'未通过'}</div>
  <p style="font-size:13px;color:#7f90a8">致命红线触发：${rec.fatalHits} 次。本证明由交互培训系统自动生成，作为人员操作能力确认的过程记录，不替代现场监督与授权考核。</p>
  <table><tr><th>步</th><th>操作环节</th><th>结果</th></tr>${rows}</table>
  <div class="stamp">EnvLab 仪器操作培训系统 · 依据受控操作规程构建（已脱敏）· 记录编号 ${rec.id}</div>
  <script>window.onload=function(){setTimeout(()=>window.print(),300)}<\/script>
  </body></html>`);
  w.document.close();
}

if(instId){
  loadInst(instId);
}else{
  const cur = getCurrent();
  const banner = cur ? `<div class="note" style="border-left:3px solid var(--accent)">当前登录学员：<b>${cur.name}</b>${cur.emp?`（${cur.emp}）`:''} · ${cur.lab}　<a class="btn ghost" href="index.html?logout=1" style="margin:0;padding:4px 10px;font-size:12px">切换 / 注销</a></div>` : "";
  const list = INLINE_INDEX;
  $("#app").innerHTML = banner + '<div class="card picker"><div class="step-no">选择培训仪器</div>'+
    list.map(i=>`<a href="?inst=${i.id}"><b>${i.name}</b> <small>· ${i.model} · ${i.category}</small></a>`).join("")+'</div>';
}
</script>
</body>
</html>
